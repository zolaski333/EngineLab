name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (MSVC, Release)
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake --preset windows-vs2022

      # Two parallel MSBuild nodes: the hosted runner runs out of compiler heap
      # (C1060) with the default one-node-per-core when JUCE is compiling. Two
      # can still run out (run 98, on run 96's green tree): the build then
      # resumes on one node, as .claude/CLAUDE.md says to, rebuilding only
      # what failed.
      - name: Build
        shell: pwsh
        run: |
          cmake --build --preset windows-release -- /m:2 /nologo /verbosity:minimal *>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0 -and (Select-String -Path build.log -Pattern 'C1060' -Quiet)) {
            Write-Output "::warning::C1060 (compiler out of heap) on two nodes; resuming on one."
            cmake --build --preset windows-release -- /m:1 /nologo /verbosity:minimal *>&1 | Tee-Object -FilePath build.log
          }
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path build.log -Pattern 'error [A-Z]+[0-9]+|fatal error' |
              Select-Object -First 30 |
              ForEach-Object { Write-Output "::error::$($_.Line.Trim())" }
            exit 1
          }

      # --output-on-failure because a job log is the only record of a CI-only
      # failure, and without it ctest names the test and says nothing else.
      - name: Test
        run: ctest --preset windows-release --parallel 2 --output-on-failure

      # A job's log can only be read signed in; an annotation can be read by
      # anyone. Name each failed test and its first FAIL lines there.
      - name: Report failed tests
        if: failure()
        shell: pwsh
        run: |
          $dir = 'out/build/windows-vs2022/Testing/Temporary'
          $lines = @()
          if (Test-Path "$dir/LastTestsFailed.log") { $lines += Get-Content "$dir/LastTestsFailed.log" }
          if (Test-Path "$dir/LastTest.log") {
            $lines += Select-String -Path "$dir/LastTest.log" -Pattern 'FAIL|Assertion' |
              Select-Object -First 40 | ForEach-Object { $_.Line.Trim() }
          }
          if ($lines.Count -gt 0) {
            Write-Output ("::error title=Failed tests::" + (($lines | ForEach-Object { $_.Replace('%', '%25') }) -join '%0A'))
          }

      - name: Package
        run: cmake --build out/build/windows-vs2022 --config Release --target package

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: EngineLab-win64
          path: out/build/windows-vs2022/EngineLab-*-win64.zip
          retention-days: 14

  linux:
    name: Linux (GCC, Release)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      # libasound2-dev is needed even though nothing here opens an audio
      # device: every headless harness links EngineLab::Audio, which pulls in
      # juce_audio_devices and its ALSA backend. libwebkit2gtk and libcurl are
      # deliberately absent -- JUCE_WEB_BROWSER and JUCE_USE_CURL are both 0.
      # xvfb, matchbox-window-manager and x11-utils are for the test step, not
      # the build: one test builds real JUCE components, and a bare Xvfb with
      # no window manager makes JUCE die with BadAtom.
      - name: Install JUCE system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config \
            libasound2-dev libjack-jackd2-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libgl1-mesa-dev libglu1-mesa-dev mesa-common-dev \
            xvfb matchbox-window-manager x11-utils libgl1-mesa-dri

      - name: Report the toolchain
        run: |
          cc --version | head -1
          c++ --version | head -1
          cmake --version | head -1
          ninja --version

      - name: Configure
        run: cmake --preset linux-gcc-release

      # -k 0 so one run reports every error instead of stopping at the first.
      - name: Build
        run: cmake --build --preset linux-gcc-release -- -k 0

      # Nothing is wrapped here: EngineLab.AudioWorkshop carries its own
      # wrapper (tests/CMakeLists.txt -> scripts/run-gui-test.sh), which is
      # what makes a contributor's bare `ctest` work locally too.
      - name: Test
        run: ctest --preset linux-gcc-release --parallel 2 --output-on-failure

      # A job's log can only be read signed in; an annotation can be read by
      # anyone. Name each failed test and its first FAIL lines there.
      - name: Report failed tests
        if: failure()
        run: |
          dir=out/build/linux-gcc-release/Testing/Temporary
          lines=$( { cat "$dir/LastTestsFailed.log"; grep -h -E 'FAIL|Assertion' "$dir/LastTest.log" | head -40; } 2>/dev/null || true)
          if [ -n "$lines" ]; then
            echo "::error title=Failed tests::$(printf '%s' "$lines" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          fi
