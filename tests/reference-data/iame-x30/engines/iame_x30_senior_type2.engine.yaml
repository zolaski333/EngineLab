# The IAME X30 125 cm3 senior (unrestricted), exhaust Type 2: a comparison
# target, not a catalogue engine. Every number below is either read from the
# sources in ../sources.md (KA = the CIK homologation form, BIL = the
# Bilsport form, OB = Ortenzi & Bossaglia 2023) and says so, or is NOT
# sourced and says what it is instead: a designer default (the value
# New engine gives every two-stroke), a catalogue value copied from the
# RD350LC, or an estimate. Nothing here was fitted to OB's measured curve
# (measured-power.csv), and nothing may be: a gap is reported, not closed.
#
# Sourced: bore 54.00, stroke 54.40, rod 102 (KA pp. 8-13); the chamber
# 12.8 cm3 measured with the volumeter, so a geometric CR (123.67 + 12.8) /
# 12.8 = 10.66 (the 10.3 cm3 Australian-insert minimum would give 13.0);
# piston with ring 128 g + pin 28 g, rod 110 g; the exhaust's 177.5 deg
# (opens 91.25 deg ATDC) and the main port's 36.5 mm chord; the transfers'
# 126 deg (117 ATDC) at 30 + 30 mm and the rear one's 127 deg (116.5) at
# 28.5 mm (KA p. 11); a 27 mm Tillotson venturi (BIL, KA p. 32); the
# 16,000 rpm limiter (BIL); the Type 2 exhaust (KA p. 32, OB Fig. 9, the
# reading in sources.md).
#
# NOT sourced, and named in every comparison:
# - the two auxiliary exhaust ports' chords (left out: the exhaust area here
#   is the main port's alone, an underestimate of unknown size);
# - port corner radii (sharp), the transfer ducts' areas (one runner, the
#   RD350's 110 x 36 mm), every Cd (the 0.72 default, not sourced);
# - the crankcase compression ratio (the designer's 1.35);
# - the reed's free length, laminate and damping (no petals: the reed stays
#   the default perfect check valve);
# - the spark: 22 deg BTDC flat is OB's MODEL input, not a measured setting
#   (the article does not give the measured runs' advance);
# - the mixture: the ECU's default map (OB's model uses lambda 0.85, the
#   measured runs' setting is not given);
# - the flame: chamber turbulence 2.0, the designer's two-stroke default,
#   calibrated on the RD350's maker timing, not on this engine;
# - friction (the RD350's), the inertia (a 2,150 g crank estimated at
#   0.004 kg m2), idle, fuel (pump 95 petrol at 98 RON), the silencer's
#   inside, the reverse cone's 68 perforations (not modelled: a solid cone);
# - the test conditions of the measured curve (dyno, correction, ambient).
schema_version: 5
family: reference two-stroke
engine:
  name: IAME X30 senior, exhaust Type 2 (reference)
  cycle: two_stroke
  layout: inline
  cylinder_count: 1
  firing_order: [1]
  idle_rpm: 2500
  redline_rpm: 16000
  rotating_inertia_kg_m2: 0.004
  friction_coefficient: 0.07
  octane_rating: 98
  plenum_volume_l: 0.25
  throttle_diameter_mm: 27
  acoustic_observer: { left_microphone_m: { x: -0.16, y: 3.5, z: 0.7 }, right_microphone_m: { x: 0.16, y: 3.5, z: 0.7 }, sound_speed_mps: 0 }
  intake:
    plenum_volume_l: 0.25
    throttle_diameter_mm: 27
    throttle_count: 1
    # The transfer runner (no source: the RD350's).
    runner_length_mm: 110
    runner_diameter_mm: 36
    airbox_volume_l: 3.0
    idle_bypass_area_mm2: 2
    throttle_gamma: 1.3
  two_stroke:
    exhaust_port_open_deg: 91.25
    transfer_port_open_deg: 116.5
    port_discharge_coefficient: 0.72
    crankcase_compression_ratio: 1.35
    exhaust_windows: [ { open_deg: 91.25, width_mm: 36.5 } ]
    transfer_windows: [ { open_deg: 117, width_mm: 30 }, { open_deg: 117, width_mm: 30 }, { open_deg: 116.5, width_mm: 28.5 } ]
  ignition:
    rev_limit_rpm: 16000
    limiter_duration_s: 0.05
    timing_curve:
      - { rpm: 0, advance_deg: 12 }
      - { rpm: 3000, advance_deg: 22 }
      - { rpm: 16000, advance_deg: 22 }
  combustion_calibration:
    chamber_turbulence_intensity_ratio: 2.00
  # A carburettor, metered as the RD350's: a port injector in the transfer
  # duct while the transfers are shut.
  injection:
    mode: port
    start_angle_deg: 250
    end_angle_deg: 355
    injector_flow_mg_s: 15000
    fuel_temperature_c: 25
    rail_pressure_bar: 3.0
    reference_pressure_bar: 3.0
    wall_film_fraction: 0.10
    vaporisation_time_constant_s: 0.020
    latent_heat_kj_per_kg: 350
    port_charge_cooling_efficiency: 0.30
  uses:
    fuel: pump_gasoline_95
  cylinders:
    - { id: 1, bore_mm: 54.0, stroke_mm: 54.4, connecting_rod_mm: 102.0, piston_mass_g: 156, connecting_rod_mass_g: 110, compression_ratio: 10.66, crank_offset_deg: 0 }
  # Type 2, inside diameters (outside less 2 x 0.9 mm): 29 mm straight; the
  # diverging bend, 390 mm on its centreline (mean of M 439 and N 341), to
  # the end of the diffuser; a 60 mm cone to the belly; the belly 100 mm;
  # the reverse cone (C 219) to the 23.5 mm exit; the tailpipe (Q 182,
  # 21 inside); the 132 mm silencer (H; its inside is not drawn: 90 mm, an
  # estimate); the outlet (21 inside). Modelled volume to the reverse-cone
  # exit 3.91 L against the homologated 4.25 L (the can's annulus round the
  # perforated cone is not modelled).
  exhaust_paths:
    - id: 1
      cylinder_ids: [1]
      audio_volume: 1.00
      acoustic_position_m: { x: 0.0, y: 0.0, z: 0.0 }
      graph:
        components:
          - { id: 101, type: pipe,    length_mm: 29,  diameter_mm: 40.7,  restriction: 0.00, resonance_hz: 0, acoustic_gain: 1.00 }
          - { id: 102, type: pipe,    length_mm: 390, diameter_mm: 40.7,  outlet_diameter_mm: 100.2, restriction: 0.00, resonance_hz: 0, acoustic_gain: 1.00 }
          - { id: 103, type: pipe,    length_mm: 60,  diameter_mm: 100.2, outlet_diameter_mm: 108.2, restriction: 0.00, resonance_hz: 0, acoustic_gain: 1.00 }
          - { id: 104, type: pipe,    length_mm: 100, diameter_mm: 108.2, restriction: 0.00, resonance_hz: 0, acoustic_gain: 1.00 }
          - { id: 105, type: pipe,    length_mm: 219, diameter_mm: 108.2, outlet_diameter_mm: 21.7, restriction: 0.00, resonance_hz: 0, acoustic_gain: 1.00 }
          - { id: 106, type: pipe,    length_mm: 182, diameter_mm: 21,    restriction: 0.00, resonance_hz: 0, acoustic_gain: 1.00 }
          - { id: 107, type: muffler, length_mm: 132, diameter_mm: 90,    volume_l: 0.84, restriction: 0.10, resonance_hz: 0, acoustic_gain: 1.00 }
          - { id: 108, type: outlet,  length_mm: 50,  diameter_mm: 21,    restriction: 0.00, resonance_hz: 0, acoustic_gain: 1.00, discharge_coefficient: 0.78 }
        cylinder_connections:
          - { cylinder_id: 1, to_component_id: 101 }
        connections:
          - { from_component_id: 101, to_component_id: 102 }
          - { from_component_id: 102, to_component_id: 103 }
          - { from_component_id: 103, to_component_id: 104 }
          - { from_component_id: 104, to_component_id: 105 }
          - { from_component_id: 105, to_component_id: 106 }
          - { from_component_id: 106, to_component_id: 107 }
          - { from_component_id: 107, to_component_id: 108 }
