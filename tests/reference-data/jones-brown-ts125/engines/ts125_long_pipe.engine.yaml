# The Suzuki TS125 single of Jones and Brown, "Determination of two-stroke
# engine exhaust noise by the method of characteristics", NASA TM-84061
# (1981; a US government work), with exhaust system the long pipe (1.30 m straight) of Fig. 6.
#
# From the paper (Appendix 1): bore x stroke 56 x 50 mm, crankcase
# compression 1.3:1, piston ports throughout, inlet open 70 deg BTDC / close
# 70 ATDC, exhaust 98 ATDC / 98 BBDC, transfers 116 ATDC / 116 BBDC, full-open
# areas exhaust 4.032 cm2 and transfers 6.16 cm2, ignition 21-23 deg BTDC,
# 9.7 kW at 7,000 rpm and 13.3 N.m at 6,500 rpm. Fig. 6: every pipe 0.04 m
# from the port, the transducer positions measured from the port. The test
# (section 3.1): a generator holding 4,000 rpm "high load"; the cylinder
# pressure at the exhaust opening is measured per figure (pc(0)), the gas's
# sound speed there (ac(0)) is the authors' estimate; the microphone 5 m from
# the outlet "in a free field close to the ground plane", where the first
# destructive ground interference fell near 1 kHz (so source and microphone
# heights multiply to about 0.43 m2: 0.65 m each).
#
# NOT in the paper, estimated here and named so: the rod (100 mm, 2 x
# stroke), from which the rectangular port widths follow; the "6.7:1"
# compression ratio read as a Japanese maker's TRAPPED one (from the exhaust
# closing: 10.0:1 geometric; read as geometric, the trapped ratio would be
# 4.6:1, too low for this engine's power), the inlet port's width (the
# model's 0.70 x bore), the port discharge coefficient (the model's 0.72),
# a 24 mm carburettor and its ducts, the inertia, the burn calibration (the
# catalogue two-stroke's 2.0) and the load: a comparison sets the throttle so
# the cylinder's pressure at the exhaust opening is the figure's pc(0).
#
# The far field stays a free-space monopole on the outlet's axis; a
# comparison adds the ground's image (hard ground, 0.65 m heights).
schema_version: 5
family: reference petrol
engine:
  name: TS125 long pipe 1.30 m (Jones & Brown 1981)
  cycle: two_stroke
  layout: inline
  cylinder_count: 1
  firing_order: [1]
  idle_rpm: 1500
  redline_rpm: 8000
  rotating_inertia_kg_m2: 0.012
  friction_coefficient: 0.07
  octane_rating: 95
  plenum_volume_l: 0.4
  throttle_diameter_mm: 24
  # The microphone 5 m from the open end on its axis (+y), in free field; the
  # ground is added by a comparison (see the header).
  acoustic_observer: { left_microphone_m: { x: 0.0, y: 5.0, z: 0.0 }, right_microphone_m: { x: 0.0, y: 5.0, z: 0.0 }, sound_speed_mps: 0, listening_distance_m: 0 }
  intake:
    plenum_volume_l: 0.4
    throttle_diameter_mm: 24
    throttle_count: 1
    runner_length_mm: 80
    runner_diameter_mm: 30
    airbox_volume_l: 2.0
    idle_bypass_area_mm2: 2
    throttle_gamma: 1.3
  two_stroke:
    intake: cylinder_port
    intake_port_open_deg_btdc: 70
    intake_port_reed: false
    exhaust_port_open_deg: 98
    transfer_port_open_deg: 116
    # Rectangular windows whose full-open areas are the published ones with
    # the 100 mm rod: 4.032 cm2 over 18.41 mm, 6.16 cm2 over 11.48 mm.
    exhaust_port_width_mm: 21.9
    transfer_port_width_mm: 53.6
    port_discharge_coefficient: 0.72
    crankcase_compression_ratio: 1.3
  # Fixed, the middle of the published 21-23 deg BTDC.
  ignition:
    rev_limit_rpm: 8500
    limiter_duration_s: 0.05
    timing_curve:
      - { rpm: 0, advance_deg: 12 }
      - { rpm: 2000, advance_deg: 22 }
      - { rpm: 8500, advance_deg: 22 }
  combustion_calibration:
    chamber_turbulence_intensity_ratio: 2.00
  uses:
    fuel: pump_gasoline_95
  injection:
    mode: port
    start_angle_deg: 250
    end_angle_deg: 355
    injector_flow_mg_s: 4000
    fuel_temperature_c: 25
    rail_pressure_bar: 3.0
    reference_pressure_bar: 3.0
    wall_film_fraction: 0.10
    vaporisation_time_constant_s: 0.020
    latent_heat_kj_per_kg: 350
    port_charge_cooling_efficiency: 0.30
  vehicle:
    mass_kg: 200
    drag_coefficient: 0.60
    frontal_area_m2: 0.60
    tire_radius_m: 0.300
    rolling_resistance_coefficient: 0.014
    tire_friction_coefficient: 1.00
    driven_axle_layout: rear
    driven_axle_weight_fraction: 0.6
    wheelbase_m: 1.35
    center_of_gravity_height_m: 0.55
    maximum_brake_force_n: 2500
  cylinders:
    - { id: 1, bore_mm: 56.0, stroke_mm: 50.0, connecting_rod_mm: 100.0, piston_mass_g: 150, compression_ratio: 10.0, crank_offset_deg: 0 }
  exhaust_paths:
    - id: 1
      cylinder_ids: [1]
      audio_volume: 1.00
      graph:
        components:
          # Transducers at the ends of 101 (0.10 m), 102 (0.84 m) and 103
          # (1.12 m) from the port; the pipe ends at 1.30 m.
          - { id: 101, type: pipe, length_mm: 100, diameter_mm: 40 }
          - { id: 102, type: pipe, length_mm: 740, diameter_mm: 40 }
          - { id: 103, type: pipe, length_mm: 280, diameter_mm: 40 }
          - { id: 104, type: pipe, length_mm: 130, diameter_mm: 40 }
          - { id: 105, type: outlet, length_mm: 50, diameter_mm: 40, acoustic_position_m: { x: 0.0, y: 0.0, z: 0.0 } }
        cylinder_connections:
          - { cylinder_id: 1, to_component_id: 101 }
        connections:
          - { from_component_id: 101, to_component_id: 102 }
          - { from_component_id: 102, to_component_id: 103 }
          - { from_component_id: 103, to_component_id: 104 }
          - { from_component_id: 104, to_component_id: 105 }
