# The BSA A50 twin with exhaust system 2 of Blair and Spechko, "Sound
# Pressure Levels Generated by Internal Combustion Engine Exhaust Systems",
# SAE 720155 (1972): both cylinders, each into a 15 in branch, the two
# branches joined in a Y into a 51 in tail pipe whose open end is flush with
# the laboratory's outer wall (Fig. 3). The 360 deg crank fires the two
# cylinders a turn apart.
#
# From the paper: as system 1 (bsa_a50_system1_straight_pipe.engine.yaml),
# with the 15 in (381 mm) branches and 51 in (1,295 mm) tail. Estimated as
# there, and also here: the Y itself (a junction of one pipe diameter's
# volume, no loss). The transducer is on cylinder 1's branch,
# 12 in from its seat.
#
# Not modelled, and named in every comparison: the ground reflection and the
# wall as an infinite baffle (see system 1).
schema_version: 5
family: reference petrol
engine:
  name: BSA A50 twin, system 2 branched pipe (Blair & Spechko 1972)
  cycle: four_stroke
  layout: inline
  cylinder_count: 2
  firing_order: [1, 2]
  idle_rpm: 1000
  redline_rpm: 7000
  rotating_inertia_kg_m2: 0.06
  friction_coefficient: 0.10
  octane_rating: 97
  plenum_volume_l: 0.25
  throttle_diameter_mm: 26
  # The meter 6 ft from the open end (+y is the outlet axis) and 4 in off
  # it; a listening distance of 0 keeps it there instead of the scene's 4 m.
  acoustic_observer: { left_microphone_m: { x: 0.1016, y: 1.8288, z: 0.0 }, right_microphone_m: { x: 0.1016, y: 1.8288, z: 0.0 }, sound_speed_mps: 0, listening_distance_m: 0 }
  intake:
    plenum_volume_l: 0.25
    throttle_diameter_mm: 26
    throttle_discharge_coefficient: 0.86
    runner_length_mm: 150
    runner_diameter_mm: 28
    runner_plenum_diameter_mm: 28
    airbox_volume_l: 0
    inlet_duct_length_mm: 0
    inlet_duct_diameter_mm: 26
    bellmouth_diameter_mm: 30
    idle_bypass_area_mm2: 6
    throttle_gamma: 1.4
  ignition:
    rev_limit_rpm: 7000
    limiter_duration_s: 0.060
    timing_curve:
      - { rpm: 0, advance_deg: 10 }
      - { rpm: 1500, advance_deg: 20 }
      - { rpm: 3000, advance_deg: 34 }
      - { rpm: 7000, advance_deg: 34 }
  solver:
    mechanical_frequency_hz: 2000
    maximum_frequency_hz: 30000
    maximum_crank_deg_per_step: 1.5
    gas_substeps: 3
  uses:
    fuel: pump_gasoline_95
  # A carburettor: fuel enters the manifold continuously.
  injection:
    mode: port
    start_angle_deg: 0
    end_angle_deg: 719
    injector_flow_mg_s: 30000
    fuel_temperature_c: 20
    rail_pressure_bar: 2.0
    reference_pressure_bar: 2.0
    wall_film_fraction: 0.38
    vaporisation_time_constant_s: 0.49
    latent_heat_kj_per_kg: 350
    port_charge_cooling_efficiency: 0.22
  camshafts:
    # IVO 40 BTDC, IVC 60 ABDC, EVO 65 BBDC, EVC 35 ATDC (Table 1): 280 deg
    # each, intake centred 100 deg after the overlap TDC, exhaust 105 before.
    intake_duration_deg: 280
    exhaust_duration_deg: 280
    intake_centerline_deg: 100
    exhaust_centerline_deg: 105
    intake_lift_mm: 9.2
    exhaust_lift_mm: 8.2
    intake_flow_curve:
      - { lift_mm: 0.0, discharge_coefficient: 0.0 }
      - { lift_mm: 2.0, discharge_coefficient: 0.36 }
      - { lift_mm: 5.0, discharge_coefficient: 0.57 }
      - { lift_mm: 9.2, discharge_coefficient: 0.66 }
    exhaust_flow_curve:
      - { lift_mm: 0.0, discharge_coefficient: 0.0 }
      - { lift_mm: 2.0, discharge_coefficient: 0.34 }
      - { lift_mm: 5.0, discharge_coefficient: 0.55 }
      - { lift_mm: 8.2, discharge_coefficient: 0.64 }
  vehicle:
    mass_kg: 200
    drag_coefficient: 0.60
    frontal_area_m2: 0.60
    tire_radius_m: 0.320
    rolling_resistance_coefficient: 0.014
    tire_friction_coefficient: 1.00
    driven_axle_layout: rear
    driven_axle_weight_fraction: 0.6
    wheelbase_m: 1.40
    center_of_gravity_height_m: 0.55
    maximum_brake_force_n: 3000
  cylinders:
    - { id: 1, bore_mm: 65.5, stroke_mm: 74.0, connecting_rod_mm: 148.0, piston_mass_g: 260, connecting_rod_mass_g: 300, compression_ratio: 9.0, crank_offset_deg: 0, intake_valve_count: 1, exhaust_valve_count: 1, intake_valve_diameter_mm: 37.0, exhaust_valve_diameter_mm: 33.0 }
    - { id: 2, bore_mm: 65.5, stroke_mm: 74.0, connecting_rod_mm: 148.0, piston_mass_g: 260, connecting_rod_mass_g: 300, compression_ratio: 9.0, crank_offset_deg: 360, intake_valve_count: 1, exhaust_valve_count: 1, intake_valve_diameter_mm: 37.0, exhaust_valve_diameter_mm: 33.0 }
  exhaust_paths:
    - id: 1
      cylinder_ids: [1, 2]
      audio_volume: 1.00
      graph:
        components:
          # Cylinder 1: seat to the transducer (60 mm of port, 245 mm of
          # pipe), then the rest of its 15 in branch.
          - { id: 101, type: pipe, length_mm: 305, diameter_mm: 34.9 }
          - { id: 102, type: pipe, length_mm: 136, diameter_mm: 34.9 }
          # Cylinder 2: port and the whole 15 in branch.
          - { id: 103, type: pipe, length_mm: 441, diameter_mm: 34.9 }
          # The Y: a junction of one pipe diameter's volume (the layout's
          # own default), no loss coefficient.
          - { id: 110, type: merge, length_mm: 0, diameter_mm: 34.9, volume_l: 0, restriction: 0 }
          # The 51 in tail to the wall.
          - { id: 104, type: pipe, length_mm: 1245, diameter_mm: 34.9 }
          - { id: 105, type: outlet, length_mm: 50, diameter_mm: 34.9, acoustic_termination: flanged, acoustic_position_m: { x: 0.0, y: 0.0, z: 0.0 } }
        cylinder_connections:
          - { cylinder_id: 1, to_component_id: 101 }
          - { cylinder_id: 2, to_component_id: 103 }
        connections:
          - { from_component_id: 101, to_component_id: 102 }
          - { from_component_id: 102, to_component_id: 110 }
          - { from_component_id: 103, to_component_id: 110 }
          - { from_component_id: 110, to_component_id: 104 }
          - { from_component_id: 104, to_component_id: 105 }
