# The BSA A50 twin with exhaust system 1 of Blair and Spechko, "Sound
# Pressure Levels Generated by Internal Combustion Engine Exhaust Systems",
# SAE 720155 (1972): cylinder 1 alone into a 66 in straight pipe whose open
# end is flush with the laboratory's outer wall; cylinder 2's exhaust is led
# away and was not part of the measurement (Fig. 3).
#
# From the paper: bore, stroke, compression ratio, the four valve events, one
# 26 mm Amal carburettor for both cylinders, 34 deg BTDC full advance (Table
# 1); the 1-3/8 in (34.9 mm) bore of all tubing and the 66 in pipe (Fig. 3);
# the transducer 12 in (305 mm) from the exhaust valve seat; the sound level
# meter 6 ft (1.829 m) from the open end and 4 in (0.102 m) off its axis.
# NOT in the paper, estimated here and named so: the exhaust port from the
# seat to the head face (60 mm, so the seat-to-end length is 1,736 mm), the
# valve heads (inlet 37, exhaust 33 mm) and lifts (0.25 x head), the rod
# (148 mm), the masses and inertia, the inlet manifold, the advance below
# 3,000 rpm, the load (full throttle assumed: a water-brake test at fixed
# speed) and cylinder 2's own pipe (1 m, silent in the audio: path 2 is
# heard at zero volume and its end faces away behind the wall).
#
# Not modelled, and named in every comparison: the measurement's ground
# reflection (meter 22 in above the ground) and the wall as an infinite
# baffle. The outlet is `flanged` (no rear hemisphere, half the edge loss)
# but the far field stays a free-space monopole: a baffle doubles the
# low-frequency pressure (+6 dB), which a comparison adds by hand.
schema_version: 5
family: reference petrol
engine:
  name: BSA A50 twin, system 1 straight pipe (Blair & Spechko 1972)
  cycle: four_stroke
  layout: inline
  cylinder_count: 2
  firing_order: [1, 2]
  idle_rpm: 1000
  redline_rpm: 7000
  rotating_inertia_kg_m2: 0.06
  friction_coefficient: 0.10
  octane_rating: 97
  plenum_volume_l: 0.25
  throttle_diameter_mm: 26
  # The meter 6 ft from the open end (+y is the outlet axis) and 4 in off
  # it; a listening distance of 0 keeps it there instead of the scene's 4 m.
  acoustic_observer: { left_microphone_m: { x: 0.1016, y: 1.8288, z: 0.0 }, right_microphone_m: { x: 0.1016, y: 1.8288, z: 0.0 }, sound_speed_mps: 0, listening_distance_m: 0 }
  intake:
    plenum_volume_l: 0.25
    throttle_diameter_mm: 26
    throttle_discharge_coefficient: 0.86
    runner_length_mm: 150
    runner_diameter_mm: 28
    runner_plenum_diameter_mm: 28
    airbox_volume_l: 0
    inlet_duct_length_mm: 0
    inlet_duct_diameter_mm: 26
    bellmouth_diameter_mm: 30
    idle_bypass_area_mm2: 6
    throttle_gamma: 1.4
  ignition:
    rev_limit_rpm: 7000
    limiter_duration_s: 0.060
    timing_curve:
      - { rpm: 0, advance_deg: 10 }
      - { rpm: 1500, advance_deg: 20 }
      - { rpm: 3000, advance_deg: 34 }
      - { rpm: 7000, advance_deg: 34 }
  solver:
    mechanical_frequency_hz: 2000
    maximum_frequency_hz: 30000
    maximum_crank_deg_per_step: 1.5
    gas_substeps: 3
  uses:
    fuel: pump_gasoline_95
  # A carburettor: fuel enters the manifold continuously.
  injection:
    mode: port
    start_angle_deg: 0
    end_angle_deg: 719
    injector_flow_mg_s: 30000
    fuel_temperature_c: 20
    rail_pressure_bar: 2.0
    reference_pressure_bar: 2.0
    wall_film_fraction: 0.38
    vaporisation_time_constant_s: 0.49
    latent_heat_kj_per_kg: 350
    port_charge_cooling_efficiency: 0.22
  camshafts:
    # IVO 40 BTDC, IVC 60 ABDC, EVO 65 BBDC, EVC 35 ATDC (Table 1): 280 deg
    # each, intake centred 100 deg after the overlap TDC, exhaust 105 before.
    intake_duration_deg: 280
    exhaust_duration_deg: 280
    intake_centerline_deg: 100
    exhaust_centerline_deg: 105
    intake_lift_mm: 9.2
    exhaust_lift_mm: 8.2
    intake_flow_curve:
      - { lift_mm: 0.0, discharge_coefficient: 0.0 }
      - { lift_mm: 2.0, discharge_coefficient: 0.36 }
      - { lift_mm: 5.0, discharge_coefficient: 0.57 }
      - { lift_mm: 9.2, discharge_coefficient: 0.66 }
    exhaust_flow_curve:
      - { lift_mm: 0.0, discharge_coefficient: 0.0 }
      - { lift_mm: 2.0, discharge_coefficient: 0.34 }
      - { lift_mm: 5.0, discharge_coefficient: 0.55 }
      - { lift_mm: 8.2, discharge_coefficient: 0.64 }
  vehicle:
    mass_kg: 200
    drag_coefficient: 0.60
    frontal_area_m2: 0.60
    tire_radius_m: 0.320
    rolling_resistance_coefficient: 0.014
    tire_friction_coefficient: 1.00
    driven_axle_layout: rear
    driven_axle_weight_fraction: 0.6
    wheelbase_m: 1.40
    center_of_gravity_height_m: 0.55
    maximum_brake_force_n: 3000
  cylinders:
    - { id: 1, bore_mm: 65.5, stroke_mm: 74.0, connecting_rod_mm: 148.0, piston_mass_g: 260, connecting_rod_mass_g: 300, compression_ratio: 9.0, crank_offset_deg: 0, intake_valve_count: 1, exhaust_valve_count: 1, intake_valve_diameter_mm: 37.0, exhaust_valve_diameter_mm: 33.0 }
    - { id: 2, bore_mm: 65.5, stroke_mm: 74.0, connecting_rod_mm: 148.0, piston_mass_g: 260, connecting_rod_mass_g: 300, compression_ratio: 9.0, crank_offset_deg: 360, intake_valve_count: 1, exhaust_valve_count: 1, intake_valve_diameter_mm: 37.0, exhaust_valve_diameter_mm: 33.0 }
  exhaust_paths:
    - id: 1
      cylinder_ids: [1]
      audio_volume: 1.00
      graph:
        components:
          # Valve seat to the transducer (60 mm of port, 245 mm of pipe),
          # then the rest of the 66 in pipe to the wall.
          - { id: 101, type: pipe, length_mm: 305, diameter_mm: 34.9 }
          - { id: 102, type: pipe, length_mm: 1381, diameter_mm: 34.9 }
          - { id: 103, type: outlet, length_mm: 50, diameter_mm: 34.9, acoustic_termination: flanged, acoustic_position_m: { x: 0.0, y: 0.0, z: 0.0 } }
        cylinder_connections:
          - { cylinder_id: 1, to_component_id: 101 }
        connections:
          - { from_component_id: 101, to_component_id: 102 }
          - { from_component_id: 102, to_component_id: 103 }
    - id: 2
      cylinder_ids: [2]
      audio_volume: 0.0
      graph:
        components:
          - { id: 201, type: pipe, length_mm: 950, diameter_mm: 34.9 }
          - { id: 202, type: outlet, length_mm: 50, diameter_mm: 34.9, acoustic_termination: flanged, acoustic_position_m: { x: 0.0, y: -3.0, z: 0.0 }, acoustic_axis: { x: 0.0, y: -1.0, z: 0.0 } }
        cylinder_connections:
          - { cylinder_id: 2, to_component_id: 201 }
        connections:
          - { from_component_id: 201, to_component_id: 202 }
