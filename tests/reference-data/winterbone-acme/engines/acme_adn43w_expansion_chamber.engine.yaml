# The ACME-ADN 43W single-cylinder diesel with silencer (b), the expansion
# chamber, as measured in Winterbone & Pearson, Design Techniques for Engine
# Manifolds (1999), section 6.6.2: Table 6.1 (engine), Fig 6.11(b)
# (silencer), Fig 6.13 (pressure 130 mm from the exhaust valve and noise
# radiated at 0.5 m, 45 deg from the tailpipe, semi-anechoic room, 3,140 rpm).
#
# From the book: bore, stroke, rod, compression ratio, the 31.7 mm valve seat,
# the four valve events, every pipe of the exhaust, the rated 6.5 kW at
# 3,000 rpm and the microphone's place. NOT in the book, estimated here and
# named so: the lifts (0.25 x valve diameter), the intake valve (36 mm; the
# seat figure is taken as the exhaust's), the intake duct beyond its 35 mm
# bore, the masses and inertia, the injection (the catalogue's common-rail
# diesel with its fuel limit set to the rated 6.5 kW at 250 g/kWh) and its
# timing, and the load of the measurement (not stated). The outlet keeps the
# catalogue's discharge coefficient.
schema_version: 5
family: reference diesel
engine:
  name: ACME-ADN 43W single diesel, expansion chamber (W&P Fig 6.11b)
  cycle: four_stroke
  fuel: diesel
  layout: inline
  cylinder_count: 1
  firing_order: [1]
  idle_rpm: 1100
  redline_rpm: 3600
  rotating_inertia_kg_m2: 0.12
  friction_coefficient: 0.16
  octane_rating: 98
  plenum_volume_l: 2.0
  throttle_diameter_mm: 40
  # Both microphones 0.5 m from the outlet at 45 deg from its axis (+y); a
  # listening distance of 0 keeps them there instead of the scene's 4 m.
  acoustic_observer: { left_microphone_m: { x: 0.3536, y: 0.3536, z: 0.0 }, right_microphone_m: { x: 0.3536, y: 0.3536, z: 0.0 }, sound_speed_mps: 0, listening_distance_m: 0 }
  intake:
    plenum_volume_l: 2.0
    throttle_diameter_mm: 40
    throttle_discharge_coefficient: 0.86
    runner_length_mm: 250
    runner_diameter_mm: 35
    runner_plenum_diameter_mm: 35
    airbox_volume_l: 0
    inlet_duct_length_mm: 0
    inlet_duct_diameter_mm: 35
    bellmouth_diameter_mm: 40
    idle_bypass_area_mm2: 0
    throttle_gamma: 1.4
  combustion_calibration:
    wall_heat_transfer_w_per_k: 0.58
    compression_ignition_mixing_time_s: 0.0016
  ignition:
    # A diesel has no spark: the advance is the start of injection, deg BTDC.
    rev_limit_rpm: 3600
    limiter_duration_s: 0.070
    timing_curve:
      - { rpm: 0, advance_deg: 4 }
      - { rpm: 1500, advance_deg: 8 }
      - { rpm: 3000, advance_deg: 12 }
      - { rpm: 3600, advance_deg: 12 }
  solver:
    mechanical_frequency_hz: 2000
    maximum_frequency_hz: 30000
    maximum_crank_deg_per_step: 1.5
    gas_substeps: 3
  uses:
    fuel: road_diesel_en590
  injection:
    mode: direct
    start_angle_deg: 700
    end_angle_deg: 74
    injector_flow_mg_s: 80000
    fuel_temperature_c: 45
    rail_pressure_bar: 2000
    reference_pressure_bar: 2000
    wall_film_fraction: 0.0
    vaporisation_time_constant_s: 0.010
    latent_heat_kj_per_kg: 270
    direct_charge_cooling_efficiency: 0.70
    direct_spray_vaporisation_time_constant_s: 0.00035
    direct_spray_entrainment_time_constant_s: 0.00018
    # 6.5 kW at 3,000 rpm and 250 g/kWh is 18 mg a cycle.
    full_load_fuel_limit:
      - { rpm: 1000, mg_per_cycle: 18 }
      - { rpm: 3600, mg_per_cycle: 18 }
  camshafts:
    # EVO 130, EVC 370, IVO 350, IVC 590 deg after firing TDC (Table 6.1).
    intake_duration_deg: 240
    exhaust_duration_deg: 240
    intake_centerline_deg: 110
    exhaust_centerline_deg: 110
    intake_lift_mm: 9.0
    exhaust_lift_mm: 7.9
    intake_flow_curve:
      - { lift_mm: 0.0, discharge_coefficient: 0.0 }
      - { lift_mm: 2.0, discharge_coefficient: 0.36 }
      - { lift_mm: 5.0, discharge_coefficient: 0.57 }
      - { lift_mm: 9.0, discharge_coefficient: 0.66 }
    exhaust_flow_curve:
      - { lift_mm: 0.0, discharge_coefficient: 0.0 }
      - { lift_mm: 2.0, discharge_coefficient: 0.34 }
      - { lift_mm: 5.0, discharge_coefficient: 0.55 }
      - { lift_mm: 7.9, discharge_coefficient: 0.64 }
  vehicle:
    mass_kg: 1000
    drag_coefficient: 0.30
    frontal_area_m2: 2.00
    tire_radius_m: 0.320
    rolling_resistance_coefficient: 0.014
    tire_friction_coefficient: 1.00
    driven_axle_layout: all
    driven_axle_weight_fraction: 1.0
    wheelbase_m: 2.65
    center_of_gravity_height_m: 0.52
    maximum_brake_force_n: 14000
  exhaust_paths:
    - id: 1
      cylinder_ids: [1]
      audio_volume: 1.00
      graph:
        components:
          # Fig 6.11(b), valve to open end. The transducer is 130 mm from the
          # valve: 60 mm into the 27 mm pipe.
          - { id: 101, type: pipe, length_mm: 70, diameter_mm: 30 }
          - { id: 102, type: pipe, length_mm: 200, diameter_mm: 27 }
          - { id: 103, type: pipe, length_mm: 100, diameter_mm: 27, outlet_diameter_mm: 66 }
          - { id: 104, type: pipe, length_mm: 70, diameter_mm: 66 }
          - { id: 105, type: pipe, length_mm: 64, diameter_mm: 77 }
          - { id: 106, type: pipe, length_mm: 185, diameter_mm: 130 }
          - { id: 107, type: outlet, length_mm: 53, diameter_mm: 77, acoustic_position_m: { x: 0.0, y: 0.0, z: 0.0 } }
        cylinder_connections:
          - { cylinder_id: 1, to_component_id: 101 }
        connections:
          - { from_component_id: 101, to_component_id: 102 }
          - { from_component_id: 102, to_component_id: 103 }
          - { from_component_id: 103, to_component_id: 104 }
          - { from_component_id: 104, to_component_id: 105 }
          - { from_component_id: 105, to_component_id: 106 }
          - { from_component_id: 106, to_component_id: 107 }
  cylinder_template:
    bore_mm: 85.0
    stroke_mm: 75.0
    connecting_rod_mm: 117.5
    piston_mass_g: 520
    connecting_rod_mass_g: 480
    compression_ratio: 19.0
    piston_friction_coefficient: 0.030
    piston_breakaway_force_n: 58
    piston_breakaway_velocity_mps: 0.09
    piston_viscous_friction_ns_per_m: 5.2
    intake_valve_count: 1
    exhaust_valve_count: 1
    intake_valve_diameter_mm: 36.0
    exhaust_valve_diameter_mm: 31.7
