schema_version: 1

# estimatedFamily rotary profile: the light lift of the top and of the
# exhaust the other high-revving cars have. No 13B recording was used and it
# has not been listened to against one; the rotary's own character comes from
# its physics (a face's exhaust port opening every 180 deg of the shaft).
voicing:
  high_frequency_gain: 1.10
  low_frequency_gain: 0.94
  exhaust_gain: 1.06
  intake_gain: 1.04
  mechanical_gain: 0.0
  stereo_width: 1.00
  outlet_jet_gain: 1.00
  saturation_drive: 0.10
  saturation_placement: post_shelf
