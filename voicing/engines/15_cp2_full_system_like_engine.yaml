schema_version: 1

# estimatedFamily open/full-system CP2 presentation. Geometry and packing remain
# physical; this layer only exposes the extra outlet and high-band energy.
voicing:
  high_frequency_gain: 1.10
  low_frequency_gain: 1.08
  exhaust_gain: 1.18
  intake_gain: 0.92
  # Owner's listening, 2026-10-12: better at 0. At 3,500 rpm WOT the layer
  # sat 20-44 dB over the exhaust from 1.25 kHz up (journal), where the
  # published motorcycle source ranking has the exhaust predominant.
  mechanical_gain: 0.0
  stereo_width: 1.08
  outlet_jet_gain: 1.16
  saturation_drive: 0.30
  saturation_placement: post_shelf
