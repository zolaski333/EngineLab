schema_version: 5
family: motorcycle
# Yamaha RD350LC (1980-82) -- 347 cc liquid-cooled two-stroke parallel twin,
# piston-ported with reed valves into the crankcase, 180-degree crank (one
# firing per crank turn per cylinder, evenly every 180 degrees).
#
# Manufacturer reference (motorcyclespecs.co.za, 1980-81 model; Wikipedia
# lists 37 kW): 34.5 kW @ 8,500 rpm, 40.2 N.m @ 8,000 rpm (the Japanese
# market lists 3.8 kgf.m, 37 N.m), 6.2:1, bore/stroke 64 x 54 mm.
# The 6.2:1 is a Japanese maker's TRAPPED ratio, counted from the exhaust
# port's closing; the model takes the geometric one, 11.2:1 for an exhaust
# port opening 82 deg after TDC (27.5 mm of the 54 mm stroke trapped).
#
# Port timings, port widths and the crankcase compression ratio are
# estimatedFamily: typical of a road two-stroke of this class (exhaust
# duration ~197 deg, transfers ~128 deg), not the maker's figures; two forum
# readings of an RD350LC port map agree (exhaust 193-209 deg, transfers
# 125-130 deg); widths are not checked. The expansion chambers below are
# estimated too: dimensions from the usual tuned-length rule for an
# 8,500 rpm peak, not measured from the bike.
#
# The real bike has Mikuni carburettors. EngineLab meters fuel with a port
# injector in the transfer duct, sprayed while the transfers are shut: the
# same mixture reaches the crankcase side of the ports, without a carburettor's
# own dynamics.
engine:
  name: Yamaha RD350LC-like 347 Two-Stroke Twin
  cycle: two_stroke
  layout: inline
  firing_order: [1, 2]
  idle_rpm: 1300
  redline_rpm: 9500
  rotating_inertia_kg_m2: 0.030
  friction_coefficient: 0.07
  octane_rating: 95
  plenum_volume_l: 0.5
  throttle_diameter_mm: 26
  acoustic_observer: { left_microphone_m: { x: -0.16, y: 3.5, z: 0.7 }, right_microphone_m: { x: 0.16, y: 3.5, z: 0.7 }, sound_speed_mps: 0 }
  # The intake path is the crankcase circuit: the throttle is the carburettor
  # bore feeding the reed, the plenum is replaced by the crankcase volume the
  # piston sweeps, and the runner is the transfer duct.
  intake:
    plenum_volume_l: 0.5
    throttle_diameter_mm: 26
    throttle_count: 1
    runner_length_mm: 110
    runner_diameter_mm: 36
    airbox_volume_l: 3.0
    # The pilot circuit: 3 mm2 per carburettor idles at 1,300 rpm with the
    # idle governor near a fifth of its travel (6 mm2 settled at 1,420).
    idle_bypass_area_mm2: 3
    throttle_gamma: 1.3
  two_stroke:
    exhaust_port_open_deg: 82
    transfer_port_open_deg: 116
    port_discharge_coefficient: 0.72
    crankcase_compression_ratio: 1.35
  # The CDI is fixed: 2.0 mm, 20 deg BTDC (Yamaha workshop manual for the
  # 4L0, as quoted by owners; parts makers give 1.8-2.0 mm), with no advance
  # curve. The 0 rpm point is the cranking advance.
  ignition:
    rev_limit_rpm: 10000
    limiter_duration_s: 0.05
    timing_curve:
      - { rpm: 0, advance_deg: 12 }
      - { rpm: 2000, advance_deg: 20 }
      - { rpm: 10000, advance_deg: 20 }
  # Squish-band head. A flame-speed calibration, not an output multiplier:
  # at 1.0 the burn centred 28 deg ATDC at 8,000 rpm with the maker's 20 deg;
  # 2.0 puts CA50 at 9 deg ATDC, the maximum-brake-torque phasing a maker
  # sets its timing for (journal 2026-10-16).
  combustion_calibration:
    chamber_turbulence_intensity_ratio: 2.00
  injection:
    mode: port
    start_angle_deg: 250
    end_angle_deg: 355
    injector_flow_mg_s: 9000
    fuel_temperature_c: 25
    rail_pressure_bar: 3.0
    reference_pressure_bar: 3.0
    wall_film_fraction: 0.10
    vaporisation_time_constant_s: 0.020
    latent_heat_kj_per_kg: 350
    port_charge_cooling_efficiency: 0.30
  uses:
    exhaust: motorcycle_4_2_1
    transmission: motorcycle_6_speed_quickshifter
    vehicle: motorcycle
  cylinders:
    - { id: 1, bore_mm: 64.0, stroke_mm: 54.0, connecting_rod_mm: 110.0, piston_mass_g: 230, compression_ratio: 11.2, crank_offset_deg: 0 }
    - { id: 2, bore_mm: 64.0, stroke_mm: 54.0, connecting_rod_mm: 110.0, piston_mass_g: 230, compression_ratio: 11.2, crank_offset_deg: 180 }
  # One expansion chamber per cylinder: header, two diffuser cones, belly,
  # baffle cone, stinger, silencer. Tuned length (port to mid-baffle) 0.94 m.
  # Stinger 26 mm, 0.65 x the header (the usual 0.6-0.7 rule).
  exhaust_paths:
    - id: 1
      cylinder_ids: [1]
      audio_volume: 1.00
      acoustic_position_m: { x: -0.22, y: 0.0, z: 0.0 }
      graph:
        components:
          - { id: 101, type: pipe,    length_mm: 260, diameter_mm: 40,  restriction: 0.00, resonance_hz: 0, acoustic_gain: 1.00 }
          - { id: 102, type: pipe,    length_mm: 220, diameter_mm: 40,  outlet_diameter_mm: 70,  restriction: 0.00, resonance_hz: 0, acoustic_gain: 1.00 }
          - { id: 103, type: pipe,    length_mm: 200, diameter_mm: 70,  outlet_diameter_mm: 110, restriction: 0.00, resonance_hz: 0, acoustic_gain: 1.00 }
          - { id: 104, type: pipe,    length_mm: 130, diameter_mm: 110, restriction: 0.00, resonance_hz: 0, acoustic_gain: 1.00 }
          - { id: 105, type: pipe,    length_mm: 260, diameter_mm: 110, outlet_diameter_mm: 26,  restriction: 0.00, resonance_hz: 0, acoustic_gain: 1.00 }
          - { id: 106, type: pipe,    length_mm: 220, diameter_mm: 26,  restriction: 0.00, resonance_hz: 0, acoustic_gain: 1.00 }
          - { id: 107, type: muffler, length_mm: 300, diameter_mm: 70,  volume_l: 1.2, restriction: 0.10, resonance_hz: 0, acoustic_gain: 1.00 }
          - { id: 108, type: outlet,  length_mm: 150, diameter_mm: 28,  restriction: 0.00, resonance_hz: 0, acoustic_gain: 1.00, discharge_coefficient: 0.78 }
        cylinder_connections:
          - { cylinder_id: 1, to_component_id: 101 }
        connections:
          - { from_component_id: 101, to_component_id: 102 }
          - { from_component_id: 102, to_component_id: 103 }
          - { from_component_id: 103, to_component_id: 104 }
          - { from_component_id: 104, to_component_id: 105 }
          - { from_component_id: 105, to_component_id: 106 }
          - { from_component_id: 106, to_component_id: 107 }
          - { from_component_id: 107, to_component_id: 108 }
    - id: 2
      cylinder_ids: [2]
      audio_volume: 0.97
      acoustic_position_m: { x: 0.22, y: 0.0, z: 0.0 }
      graph:
        components:
          - { id: 201, type: pipe,    length_mm: 260, diameter_mm: 40,  restriction: 0.00, resonance_hz: 0, acoustic_gain: 1.00 }
          - { id: 202, type: pipe,    length_mm: 220, diameter_mm: 40,  outlet_diameter_mm: 70,  restriction: 0.00, resonance_hz: 0, acoustic_gain: 1.00 }
          - { id: 203, type: pipe,    length_mm: 200, diameter_mm: 70,  outlet_diameter_mm: 110, restriction: 0.00, resonance_hz: 0, acoustic_gain: 1.00 }
          - { id: 204, type: pipe,    length_mm: 130, diameter_mm: 110, restriction: 0.00, resonance_hz: 0, acoustic_gain: 1.00 }
          - { id: 205, type: pipe,    length_mm: 260, diameter_mm: 110, outlet_diameter_mm: 26,  restriction: 0.00, resonance_hz: 0, acoustic_gain: 1.00 }
          - { id: 206, type: pipe,    length_mm: 220, diameter_mm: 26,  restriction: 0.00, resonance_hz: 0, acoustic_gain: 1.00 }
          - { id: 207, type: muffler, length_mm: 300, diameter_mm: 70,  volume_l: 1.2, restriction: 0.10, resonance_hz: 0, acoustic_gain: 1.00 }
          - { id: 208, type: outlet,  length_mm: 150, diameter_mm: 28,  restriction: 0.00, resonance_hz: 0, acoustic_gain: 1.00, discharge_coefficient: 0.78 }
        cylinder_connections:
          - { cylinder_id: 2, to_component_id: 201 }
        connections:
          - { from_component_id: 201, to_component_id: 202 }
          - { from_component_id: 202, to_component_id: 203 }
          - { from_component_id: 203, to_component_id: 204 }
          - { from_component_id: 204, to_component_id: 205 }
          - { from_component_id: 205, to_component_id: 206 }
          - { from_component_id: 206, to_component_id: 207 }
          - { from_component_id: 207, to_component_id: 208 }
