schema_version: 8
family: motorcycle
# Deliberately audible listening-lab variant of engine 15. The base geometry,
# fuelling, valvetrain and vehicle are unchanged. This variant alone opts into
# cycle variability, a wet spark-cut limiter, physical exhaust afterfire and
# representative absorptive packing so users can select one engine and hear the
# complete feature path. Values are engineering estimates, not Yamaha or any
# exhaust manufacturer's calibration. The name intentionally avoids the stock
# catalogue reference filter (see engine 15).
engine:
  name: Audio Physics Lab 689 Twin
  layout: inline
  firing_order: [1, 2]
  idle_rpm: 1400
  redline_rpm: 10000
  rotating_inertia_kg_m2: 0.052
  friction_coefficient: 0.09
  octane_rating: 98
  plenum_volume_l: 1.0
  throttle_diameter_mm: 38
  acoustic_observer: { left_microphone_m: { x: -0.16, y: 3.5, z: 0.7 }, right_microphone_m: { x: 0.16, y: 3.5, z: 0.7 }, sound_speed_mps: 0 }
  intake:
    plenum_volume_l: 1.0
    throttle_diameter_mm: 38
    throttle_count: 2
    runner_length_mm: 120
    runner_diameter_mm: 35
    airbox_volume_l: 6.0
    idle_bypass_area_mm2: 14
    throttle_gamma: 1.3
  ignition:
    rev_limit_rpm: 10500
    limiter_duration_s: 0.05
    limiter_keeps_fuel: true
    timing_curve:
      - { rpm: 0, advance_deg: 10 }
      - { rpm: 2000, advance_deg: 18 }
      - { rpm: 4000, advance_deg: 30 }
      - { rpm: 6500, advance_deg: 34 }
      - { rpm: 8750, advance_deg: 33 }
      - { rpm: 10500, advance_deg: 30 }
  combustion_calibration:
    chamber_turbulence_intensity_ratio: 0.80
    cycle_variation_cov: 0.06
    cycle_variation_correlation: 0.55
  exhaust_afterfire:
    enabled: true
    strategy: discrete_afterfire
    ignition_temperature_k: 800
    # Compact burn time of the listening-lab slug.  The former 8 ms value
    # spread the same conservative energy into a low-crest swell; 2 ms remains
    # inside the authored control range and produces a resolved pressure front
    # without reaching the 100 kPa linear-network safety bound.
    reaction_time_constant_s: 0.002
    reaction_efficiency: 0.95
    # Eight percent average fuel with the matching 8% duty commands full normal
    # fuelling only inside each short slug. The former 18% / 35% / 4 Hz profile
    # held the injector window open for 87.5 ms and covered many cylinder firing
    # opportunities; measured heat duty reached 76.6% on this Twin and nearly
    # 100% on the K20, which was an anti-lag-like roar rather than discrete pops.
    # The new 40 ms window lowers total retained fuel while remaining locally
    # combustible. Oxygen, wall heat and the induction gate are still required.
    overrun_fuel_fraction: 0.08
    overrun_minimum_rpm: 3000
    overrun_maximum_throttle: 0.02
    # Two fuel slugs per second. Fuel retained during the open 8% window is
    # normalised by duty, so pulse timing changes texture rather than mass.
    overrun_pulse_hz: 2.0
    overrun_pulse_duty: 0.08
    # Interval scatter is bounded at +/-40%. The duty is recomputed from each
    # actual interval, so irregular timing does not change average fuel mass.
    overrun_pulse_timing_variation: 0.40
    # Reference Livengood-Wu delay at 800 K, 101.325 kPa and phi=1. The
    # Arrhenius/pressure/mixture exponents below reproduce the FORM of a global
    # high-temperature gasoline-surrogate correlation (Ea/R=13340 K,
    # p^-0.989, phi^-0.577). Its published 4-60 atm / 968-1361 K corpus does not
    # calibrate this 1-atm exhaust, so the 4 ms reference remains explicitly an
    # engineering estimate rather than an OEM or chemistry-mechanism claim.
    induction_time_s: 0.004
    induction_reference_pressure_kpa: 101.325
    induction_activation_temperature_k: 13340
    induction_pressure_exponent: 0.989
    induction_equivalence_ratio_exponent: -0.577
    induction_decay_time_s: 0.008
    minimum_equivalence_ratio: 0.45
    maximum_equivalence_ratio: 1.80
    quench_temperature_k: 520
  uses:
    injection: high_flow_port
    exhaust: cp2_absorptive_lab
    transmission: motorcycle_6_speed
    vehicle: motorcycle
  camshafts:
    intake_duration_deg: 256
    exhaust_duration_deg: 248
    intake_lift_mm: 8.6
    exhaust_lift_mm: 7.9
    intake_centerline_deg: 106
    exhaust_centerline_deg: 110
  cylinders:
    - { id: 1, bore_mm: 80.0, stroke_mm: 68.6, connecting_rod_mm: 115.0, piston_mass_g: 180, compression_ratio: 11.5, crank_offset_deg: 0,   intake_valve_count: 2, exhaust_valve_count: 2 }
    - { id: 2, bore_mm: 80.0, stroke_mm: 68.6, connecting_rod_mm: 115.0, piston_mass_g: 180, compression_ratio: 11.5, crank_offset_deg: 270, intake_valve_count: 2, exhaust_valve_count: 2 }
