schema_version: 5
family: motorcycle
# CP2 689 cc parallel twin fitted with an AFTERMARKET FULL 2-1 SYSTEM.
#
# This is a listening variant of `11_yamaha_cp2_mt07_like.engine.yaml`. Every
# field below is identical to that file except `uses: exhaust:`, which selects
# `cp2_full_system` instead of the shared `motorcycle_4_2_1` street preset. It
# exists so the same engine can be A/B'd against the aftermarket recordings that
# dominate what is available online -- almost every engine video is a modified
# exhaust, so comparing a stock configuration against them is a confound.
#
# ---------------------------------------------------------------------------
# TWO RULES FOR WHOEVER EDITS THIS FILE
#
# 1. THE NAME MUST NOT CONTAIN "Yamaha CP2".
#    `EngineLabDynoSweepHarness` selects manufacturer reference points by testing
#    whether a CSV `engine_filter` is CONTAINED IN the engine name
#    (DynoSweepHarness.cpp, the `containsCaseInsensitive` call in the per-entry
#    loop). The filter for the stock bike is exactly "Yamaha CP2". If this
#    variant's name contained it, this engine would be silently held to the
#    MT-07's rated 68 Nm and 54 kW -- with a race exhaust fitted. The test would
#    either fail, or pass for the wrong reason. The name below is chosen to match
#    no filter in tests/reference-data/catalog-manufacturer-points.csv.
#
# 2. THERE IS NO INHERITANCE. The catalogue loader simply scans engines/, so this
#    file is a full duplicate and will DRIFT from engine 11 as that one is tuned.
#    If the catalogue ever grows a variant-per-engine set, add a real inheritance
#    or override mechanism first rather than maintaining fourteen copies.
# ---------------------------------------------------------------------------
#
# No manufacturer figures exist for this configuration, and none are claimed: a
# full system changes VE and back pressure, so the torque this produces is NOT
# comparable to the rated stock numbers. That is exactly why the stock engine is
# left untouched and this is additive.
engine:
  name: MT-07-like 689 Twin Full System
  layout: inline
  firing_order: [1, 2]
  idle_rpm: 1400
  redline_rpm: 10000
  rotating_inertia_kg_m2: 0.052
  friction_coefficient: 0.09
  octane_rating: 98
  plenum_volume_l: 1.0
  throttle_diameter_mm: 38
  acoustic_observer: { left_microphone_m: { x: -0.16, y: 3.5, z: 0.7 }, right_microphone_m: { x: 0.16, y: 3.5, z: 0.7 }, sound_speed_mps: 0 }
  intake:
    plenum_volume_l: 1.0
    throttle_diameter_mm: 38
    throttle_count: 2
    runner_length_mm: 120
    runner_diameter_mm: 35
    airbox_volume_l: 6.0
    idle_bypass_area_mm2: 14
    throttle_gamma: 1.3
  ignition:
    rev_limit_rpm: 10500
    limiter_duration_s: 0.05
    timing_curve:
      - { rpm: 0, advance_deg: 10 }
      - { rpm: 2000, advance_deg: 18 }
      - { rpm: 4000, advance_deg: 30 }
      - { rpm: 6500, advance_deg: 34 }
      - { rpm: 8750, advance_deg: 33 }
      - { rpm: 10500, advance_deg: 30 }
  combustion_calibration:
    chamber_turbulence_intensity_ratio: 0.80
  uses:
    injection: high_flow_port
    # The only functional difference from engine 11.
    exhaust: cp2_full_system
    transmission: motorcycle_6_speed
    vehicle: motorcycle
  camshafts:
    intake_duration_deg: 256
    exhaust_duration_deg: 248
    intake_lift_mm: 8.6
    exhaust_lift_mm: 7.9
    intake_centerline_deg: 106
    exhaust_centerline_deg: 110
  cylinders:
    - { id: 1, bore_mm: 80.0, stroke_mm: 68.6, connecting_rod_mm: 115.0, piston_mass_g: 180, compression_ratio: 11.5, crank_offset_deg: 0,   intake_valve_count: 2, exhaust_valve_count: 2 }
    - { id: 2, bore_mm: 80.0, stroke_mm: 68.6, connecting_rod_mm: 115.0, piston_mass_g: 180, compression_ratio: 11.5, crank_offset_deg: 270, intake_valve_count: 2, exhaust_valve_count: 2 }
