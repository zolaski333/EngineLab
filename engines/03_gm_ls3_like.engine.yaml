schema_version: 6
family: american v8
engine:
  name: LS3-like 6.2 Crossplane V8
  layout: v
  bank_angle_deg: 90
  cylinder_count: 8
  firing_order: [1, 8, 7, 2, 6, 5, 4, 3]
  idle_rpm: 720
  redline_rpm: 6600
  rotating_inertia_kg_m2: 0.52
  friction_coefficient: 0.16
  octane_rating: 95
  plenum_volume_l: 6.0
  throttle_diameter_mm: 90
  acoustic_observer: { left_microphone_m: { x: -0.18, y: 4.0, z: 0.8 }, right_microphone_m: { x: 0.18, y: 4.0, z: 0.8 }, sound_speed_mps: 0 }
  intake:
    plenum_volume_l: 6.0
    throttle_diameter_mm: 90
    runner_length_mm: 280
    runner_diameter_mm: 50
    idle_bypass_area_mm2: 60
    throttle_gamma: 1.35
    # Filter housing, estimatedFamily. Authored, not surveyed; acoustic only.
    airbox_volume_l: 7.0
    inlet_duct_length_mm: 300
    inlet_duct_diameter_mm: 95
    bellmouth_diameter_mm: 105
  ignition:
    rev_limit_rpm: 6700
    limiter_duration_s: 0.065
    timing_curve:
      - { rpm: 0, advance_deg: 8 }
      - { rpm: 1200, advance_deg: 14 }
      - { rpm: 2500, advance_deg: 22 }
      - { rpm: 4200, advance_deg: 27 }
      # High-speed WOT phasing anchored by the stock 321 kW @5900 rpm point.
      # This changes pressure phasing rather than applying a torque multiplier.
      - { rpm: 5800, advance_deg: 33 }
      - { rpm: 6700, advance_deg: 30 }
  uses:
    injection: sequential_port
    camshafts: big_v8_street
    exhaust: crossplane_dual
    transmission: muscle_6_speed
    vehicle: muscle_car
  exhaust_paths:
    # One global DAG: both banks meet at a finite X section and split again.
    # The former two path-local graphs could not transmit a wave or mean-flow
    # perturbation across banks, so "crossplane_dual" had no X-pipe in the
    # simulation despite its name.
    - id: 1
      cylinder_ids: [1, 2, 3, 4, 5, 6, 7, 8]
      audio_volume: 1.00
      graph:
        components:
          - { id: 101, type: pipe, length_mm: 690, diameter_mm: 48 }
          - { id: 102, type: pipe, length_mm: 690, diameter_mm: 48 }
          - { id: 103, type: pipe, length_mm: 690, diameter_mm: 48 }
          - { id: 104, type: pipe, length_mm: 690, diameter_mm: 48 }
          - { id: 105, type: pipe, length_mm: 690, diameter_mm: 48 }
          - { id: 106, type: pipe, length_mm: 690, diameter_mm: 48 }
          - { id: 107, type: pipe, length_mm: 690, diameter_mm: 48 }
          - { id: 108, type: pipe, length_mm: 690, diameter_mm: 48 }
          - { id: 201, type: merge, length_mm: 620, diameter_mm: 76, volume_l: 3.0, restriction: 0.04 }
          - { id: 202, type: merge, length_mm: 620, diameter_mm: 76, volume_l: 3.0, restriction: 0.04 }
          - { id: 301, type: merge, length_mm: 140, diameter_mm: 80, volume_l: 0.70, restriction: 0.03 }
          - { id: 302, type: splitter, length_mm: 140, diameter_mm: 80, volume_l: 0.70, restriction: 0.03 }
          - { id: 401, type: muffler, length_mm: 400, diameter_mm: 76, volume_l: 6.3, restriction: 0.30, packing_flow_resistivity_pa_s_m2: 10000, packing_thickness_mm: 15, perforated_open_area_ratio: 0.35 }
          - { id: 402, type: muffler, length_mm: 400, diameter_mm: 76, volume_l: 6.3, restriction: 0.30, packing_flow_resistivity_pa_s_m2: 10000, packing_thickness_mm: 15, perforated_open_area_ratio: 0.35 }
          - { id: 501, type: outlet, length_mm: 80, diameter_mm: 82, discharge_coefficient: 0.72, acoustic_position_m: { x: -0.45, y: 0.0, z: 0.0 } }
          - { id: 502, type: outlet, length_mm: 80, diameter_mm: 82, discharge_coefficient: 0.72, acoustic_position_m: { x: 0.45, y: 0.0, z: 0.0 } }
        cylinder_connections:
          - { cylinder_id: 1, to_component_id: 101 }
          - { cylinder_id: 2, to_component_id: 102 }
          - { cylinder_id: 3, to_component_id: 103 }
          - { cylinder_id: 4, to_component_id: 104 }
          - { cylinder_id: 5, to_component_id: 105 }
          - { cylinder_id: 6, to_component_id: 106 }
          - { cylinder_id: 7, to_component_id: 107 }
          - { cylinder_id: 8, to_component_id: 108 }
        connections:
          - { from_component_id: 101, to_component_id: 201 }
          - { from_component_id: 103, to_component_id: 201 }
          - { from_component_id: 105, to_component_id: 201 }
          - { from_component_id: 107, to_component_id: 201 }
          - { from_component_id: 102, to_component_id: 202 }
          - { from_component_id: 104, to_component_id: 202 }
          - { from_component_id: 106, to_component_id: 202 }
          - { from_component_id: 108, to_component_id: 202 }
          - { from_component_id: 201, to_component_id: 301 }
          - { from_component_id: 202, to_component_id: 301 }
          - { from_component_id: 301, to_component_id: 302 }
          - { from_component_id: 302, to_component_id: 401 }
          - { from_component_id: 302, to_component_id: 402 }
          - { from_component_id: 401, to_component_id: 501 }
          - { from_component_id: 402, to_component_id: 502 }
  cylinder_template:
    bore_mm: 103.25
    stroke_mm: 92.0
    connecting_rod_mm: 155.0
    piston_mass_g: 520
    compression_ratio: 10.7
    intake_valve_count: 1
    exhaust_valve_count: 1
    intake_valve_diameter_mm: 55.0
    exhaust_valve_diameter_mm: 40.4
