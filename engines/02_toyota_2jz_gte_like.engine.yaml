schema_version: 5
family: turbo inline
engine:
  name: 2JZ-GTE-like 3.0 I6 Turbo
  layout: inline
  cylinder_count: 6
  firing_order: [1, 5, 3, 6, 2, 4]
  idle_rpm: 760
  redline_rpm: 7200
  rotating_inertia_kg_m2: 0.36
  friction_coefficient: 0.14
  octane_rating: 98
  plenum_volume_l: 4.2
  throttle_diameter_mm: 74
  acoustic_observer: { left_microphone_m: { x: -0.22, y: 5.0, z: 1.0 }, right_microphone_m: { x: 0.22, y: 5.0, z: 1.0 }, sound_speed_mps: 0 }
  intake:
    plenum_volume_l: 4.2
    throttle_diameter_mm: 74
    runner_length_mm: 330
    runner_diameter_mm: 44
    airbox_volume_l: 5.5
    inlet_duct_length_mm: 240
    inlet_duct_diameter_mm: 85
    bellmouth_diameter_mm: 100
    idle_bypass_area_mm2: 22
    throttle_gamma: 1.45
  forced_induction:
    enabled: true
    type: turbocharger
    # Export 2JZ-GTE rated-point calibration. A 1.92 absolute pressure ratio is
    # still a stock-class ~0.9 bar boost and keeps both 4000-rpm torque and
    # 5600-rpm power inside the manufacturer ±15% gate.
    pressure_ratio: 1.92
    full_boost_rpm: 3600
    compressor_efficiency: 0.72
    turbine_efficiency: 0.70
    shaft_inertia_kg_m2: 0.00016
    wastegate_pressure_ratio: 1.89
    charge_temperature_rise_c: 42
    # Family-level acoustic estimates; replace with measured turbo geometry.
    compressor_blade_count: 6
    turbine_blade_count: 11
    compressor_inducer_diameter_mm: 48
    turbine_exducer_diameter_mm: 45
    blow_off_valve_flow_area_mm2: 380
    blow_off_valve_opening_pressure_ratio: 1.12
    blow_off_valve_discharge_coefficient: 0.72
    tonal_acoustic_efficiency: 0.000001
    turbulent_jet_noise_coefficient: 0.00001
  ignition:
    rev_limit_rpm: 7000
    limiter_duration_s: 0.070
    timing_curve:
      - { rpm: 0, advance_deg: 7 }
      - { rpm: 1200, advance_deg: 12 }
      - { rpm: 2400, advance_deg: 18 }
      - { rpm: 3600, advance_deg: 15 }
      - { rpm: 5200, advance_deg: 18 }
      - { rpm: 7000, advance_deg: 16 }
  uses:
    injection: sequential_port
    camshafts: turbo_street
    exhaust: turbo_downpipe
    transmission: jdm_6_speed
    vehicle: jdm_gt
  cylinder_template:
    bore_mm: 86.0
    stroke_mm: 86.0
    connecting_rod_mm: 142.0
    piston_mass_g: 430
    compression_ratio: 8.7
