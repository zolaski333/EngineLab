schema_version: 4
family: motorcycle
# Yamaha CP3 (MT-09 / Tracer 9 / YZF-R9) -- 890 cc inline triple with a
# 120-degree crank. A three-cylinder 120-deg crank fires evenly every 240 deg,
# so the crank offsets 0 / 240 / 480 are the natural spacing; they are written
# explicitly only to keep the crankpin geometry (0/120/240 mod 360) and the
# firing sequence 1-2-3 documented and independent of loader defaults.
#
# Manufacturer reference (890 CP3): 87.5 kW (117.3 PS) @ 10000 rpm,
# 93 Nm @ 7000 rpm, 11.5:1, bore/stroke 78.0 x 62.1.
engine:
  name: Yamaha CP3 MT-09-like 890 Triple
  layout: inline
  firing_order: [1, 2, 3]
  idle_rpm: 1300
  redline_rpm: 11000
  rotating_inertia_kg_m2: 0.046
  friction_coefficient: 0.09
  octane_rating: 98
  plenum_volume_l: 1.2
  throttle_diameter_mm: 41
  acoustic_observer: { left_microphone_m: { x: -0.17, y: 3.6, z: 0.7 }, right_microphone_m: { x: 0.17, y: 3.6, z: 0.7 }, sound_speed_mps: 0 }
  intake:
    plenum_volume_l: 1.2
    throttle_diameter_mm: 41
    throttle_count: 3
    runner_length_mm: 110
    runner_diameter_mm: 36
    airbox_volume_l: 7.0
    idle_bypass_area_mm2: 15
    throttle_gamma: 1.3
  ignition:
    rev_limit_rpm: 11500
    limiter_duration_s: 0.05
    timing_curve:
      - { rpm: 0, advance_deg: 10 }
      - { rpm: 2000, advance_deg: 20 }
      - { rpm: 4500, advance_deg: 32 }
      - { rpm: 7000, advance_deg: 35 }
      - { rpm: 10000, advance_deg: 33 }
      - { rpm: 11500, advance_deg: 30 }
  uses:
    injection: high_flow_port
    exhaust: motorcycle_4_2_1
    transmission: motorcycle_6_speed
    vehicle: motorcycle
  # Valve diameters are deliberately NOT authored here. They were, at 25.5/21.5,
  # and that was the single biggest error in this file: it is roughly a 4-valve
  # head's worth of area short, and it capped the engine at 64 % of the
  # manufacturer's peak power. The derived fallback (0.40 and 0.34 x bore per
  # valve for a multi-valve head) lands at 31.2/26.5, inside the literature band
  # and within a millimetre of the real MT-09 head. Author a diameter only when
  # you actually know it; guessing one low is worse than the default.
  #
  # Sport-triple cam: more duration/lift than the CP2, torque peak near 7000,
  # power carried to 10000.
  camshafts:
    intake_duration_deg: 266
    exhaust_duration_deg: 258
    intake_lift_mm: 9.1
    exhaust_lift_mm: 8.4
    intake_centerline_deg: 105
    exhaust_centerline_deg: 109
  cylinders:
    - { id: 1, bore_mm: 78.0, stroke_mm: 62.1, connecting_rod_mm: 104.0, piston_mass_g: 165, compression_ratio: 11.5, crank_offset_deg: 0,   intake_valve_count: 2, exhaust_valve_count: 2 }
    - { id: 2, bore_mm: 78.0, stroke_mm: 62.1, connecting_rod_mm: 104.0, piston_mass_g: 165, compression_ratio: 11.5, crank_offset_deg: 240, intake_valve_count: 2, exhaust_valve_count: 2 }
    - { id: 3, bore_mm: 78.0, stroke_mm: 62.1, connecting_rod_mm: 104.0, piston_mass_g: 165, compression_ratio: 11.5, crank_offset_deg: 480, intake_valve_count: 2, exhaust_valve_count: 2 }
