schema_version: 4
family: boxer turbo
engine:
  name: EJ25-like 2.5 Flat-4 Turbo
  layout: flat
  bank_angle_deg: 180
  cylinder_count: 4
  firing_order: [1, 3, 2, 4]
  idle_rpm: 820
  redline_rpm: 6800
  rotating_inertia_kg_m2: 0.29
  friction_coefficient: 0.15
  octane_rating: 98
  plenum_volume_l: 3.2
  throttle_diameter_mm: 65
  acoustic_observer: { left_microphone_m: { x: -0.18, y: 4.0, z: 0.8 }, right_microphone_m: { x: 0.18, y: 4.0, z: 0.8 }, sound_speed_mps: 0 }
  intake:
    plenum_volume_l: 3.2
    throttle_diameter_mm: 65
    runner_length_mm: 340
    runner_diameter_mm: 42
    airbox_volume_l: 4.0
    inlet_duct_length_mm: 260
    inlet_duct_diameter_mm: 78
    bellmouth_diameter_mm: 92
    idle_bypass_area_mm2: 40
    throttle_gamma: 1.50
  forced_induction:
    enabled: true
    type: turbocharger
    # WRX STI brochure: 16.2 psi maximum gauge boost, i.e. about 2.10
    # absolute pressure ratio at standard ambient pressure.
    pressure_ratio: 2.10
    full_boost_rpm: 3000
    compressor_efficiency: 0.70
    turbine_efficiency: 0.69
    shaft_inertia_kg_m2: 0.00011
    wastegate_pressure_ratio: 2.05
    charge_temperature_rise_c: 46
    # Family-level acoustic estimates; replace with measured turbo geometry.
    compressor_blade_count: 6
    turbine_blade_count: 9
    compressor_inducer_diameter_mm: 46
    turbine_exducer_diameter_mm: 41
    blow_off_valve_flow_area_mm2: 320
    blow_off_valve_opening_pressure_ratio: 1.12
    blow_off_valve_discharge_coefficient: 0.72
    tonal_acoustic_efficiency: 0.000001
    turbulent_jet_noise_coefficient: 0.00001
  ignition:
    rev_limit_rpm: 6800
    limiter_duration_s: 0.070
    timing_curve:
      - { rpm: 0, advance_deg: 7 }
      - { rpm: 1200, advance_deg: 12 }
      - { rpm: 2400, advance_deg: 16 }
      - { rpm: 3400, advance_deg: 15 }
      - { rpm: 5200, advance_deg: 20 }
      - { rpm: 6800, advance_deg: 18 }
  # Effective high-boost pent-roof tumble. This is a flame-speed calibration,
  # not an output multiplier.
  combustion_calibration:
    chamber_turbulence_intensity_ratio: 1.50
  uses:
    injection: sequential_port
    camshafts: turbo_street
    exhaust: compact_sport
    transmission: sport_6_speed
    vehicle: rally_sedan
  exhaust_paths:
    - { id: 1, cylinder_ids: [1, 3], audio_volume: 1.00, acoustic_position_m: { x: -0.35, y: 0.0, z: 0.0 } }
    - { id: 2, cylinder_ids: [2, 4], audio_volume: 0.94, acoustic_position_m: { x: 0.35, y: 0.0, z: 0.0 } }
  cylinder_template:
    bore_mm: 99.5
    stroke_mm: 79.0
    connecting_rod_mm: 130.5
    piston_mass_g: 455
    compression_ratio: 8.4
