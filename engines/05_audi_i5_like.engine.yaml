schema_version: 5
family: odd inline
engine:
  name: Audi I5-like 2.5 Turbo
  layout: inline
  cylinder_count: 5
  firing_order: [1, 2, 4, 5, 3]
  idle_rpm: 780
  redline_rpm: 7100
  rotating_inertia_kg_m2: 0.31
  friction_coefficient: 0.13
  octane_rating: 98
  plenum_volume_l: 3.6
  throttle_diameter_mm: 70
  acoustic_observer: { left_microphone_m: { x: -0.18, y: 4.0, z: 0.8 }, right_microphone_m: { x: 0.18, y: 4.0, z: 0.8 }, sound_speed_mps: 0 }
  intake:
    plenum_volume_l: 3.6
    throttle_diameter_mm: 70
    runner_length_mm: 360
    runner_diameter_mm: 43
    airbox_volume_l: 5.0
    inlet_duct_length_mm: 300
    inlet_duct_diameter_mm: 82
    bellmouth_diameter_mm: 96
    idle_bypass_area_mm2: 21
    throttle_gamma: 1.45
  forced_induction:
    enabled: true
    type: turbocharger
    # Audi publishes 1.5 bar relative / 2.5 bar absolute maximum boost for
    # the EA855 Evo Sport represented by this bore and stroke.
    pressure_ratio: 2.50
    full_boost_rpm: 3200
    compressor_efficiency: 0.73
    turbine_efficiency: 0.71
    shaft_inertia_kg_m2: 0.00013
    wastegate_pressure_ratio: 2.45
    charge_temperature_rise_c: 43
    # Family-level acoustic estimates; replace with measured turbo geometry.
    compressor_blade_count: 7
    turbine_blade_count: 9
    compressor_inducer_diameter_mm: 52
    turbine_exducer_diameter_mm: 45
    blow_off_valve_flow_area_mm2: 360
    blow_off_valve_opening_pressure_ratio: 1.12
    blow_off_valve_discharge_coefficient: 0.72
    tonal_acoustic_efficiency: 0.000001
    turbulent_jet_noise_coefficient: 0.00001
  ignition:
    rev_limit_rpm: 7300
    limiter_duration_s: 0.065
    timing_curve:
      - { rpm: 0, advance_deg: 7 }
      - { rpm: 1200, advance_deg: 12 }
      - { rpm: 2400, advance_deg: 17 }
      # Current dyno-hold A/B: 13 deg gave 424.088 Nm (-15.182%) at
      # 4,000 rpm; 14 deg gives 437.036 Nm (-12.593%) without moving the
      # 5,600 rpm power point outside its independent envelope.
      - { rpm: 3400, advance_deg: 14 }
      - { rpm: 5600, advance_deg: 18 }
      - { rpm: 7300, advance_deg: 16 }
  combustion_calibration:
    chamber_turbulence_intensity_ratio: 1.50
  uses:
    # The real EA855 Evo combines direct and manifold injection. EngineLab
    # currently selects one topology, so retain the manifold branch rather than
    # pretending the direct-only preset represents both systems.
    injection: sequential_port
    camshafts: turbo_street
    exhaust: turbo_downpipe
    transmission: sport_6_speed
    vehicle: compact_awd
  cylinder_template:
    bore_mm: 82.5
    stroke_mm: 92.8
    connecting_rod_mm: 144.0
    piston_mass_g: 405
    compression_ratio: 9.3
