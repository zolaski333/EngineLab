schema_version: 1
family: aircraft
engine:
  name: Merlin-like 19.8 V12 Scaled
  layout: v
  bank_angle_deg: 60
  cylinder_count: 12
  firing_order: [1, 8, 5, 10, 3, 7, 6, 11, 2, 9, 4, 12]
  idle_rpm: 800
  redline_rpm: 3800
  rotating_inertia_kg_m2: 1.85
  friction_coefficient: 0.13
  octane_rating: 100
  cooling_efficiency: 3.2
  plenum_volume_l: 18.0
  throttle_diameter_mm: 120
  intake:
    plenum_volume_l: 18.0
    throttle_diameter_mm: 120
    runner_length_mm: 520
    runner_diameter_mm: 58
    airbox_volume_l: 25.0
    inlet_duct_length_mm: 400
    inlet_duct_diameter_mm: 150
    bellmouth_diameter_mm: 180
    idle_bypass_area_mm2: 140
    throttle_gamma: 1.30
  forced_induction:
    enabled: true
    type: supercharger
    pressure_ratio: 1.72
    full_boost_rpm: 2300
    compressor_efficiency: 0.70
    charge_temperature_rise_c: 48
    # Family-level acoustic estimates for a geared centrifugal supercharger.
    compressor_blade_count: 12
    supercharger_drive_ratio: 8.1
    compressor_inducer_diameter_mm: 250
    tonal_acoustic_efficiency: 0.000001
  thermal:
    coolant_mass_kj_per_c: 1350
    oil_mass_kj_per_c: 620
    coolant_heat_share: 0.26
    oil_heat_share: 0.13
    cooling_power_kw_per_c: 1.15
    oil_cooling_power_kw_per_c: 0.58
  ignition:
    rev_limit_rpm: 3200
    limiter_duration_s: 0.090
    timing_curve:
      - { rpm: 0, advance_deg: 4 }
      - { rpm: 900, advance_deg: 9 }
      - { rpm: 1600, advance_deg: 14 }
      - { rpm: 2400, advance_deg: 18 }
      - { rpm: 3200, advance_deg: 16 }
  uses:
    fuel: avgas_100ll
    injection: continuous_manifold
    camshafts: v12_aircraft
    exhaust: aircraft_manifold
    transmission: aircraft_direct
    vehicle: test_stand
  exhaust_paths:
    - { id: 1, cylinder_ids: [1, 3, 5, 7, 9, 11], audio_volume: 1.00 }
    - { id: 2, cylinder_ids: [2, 4, 6, 8, 10, 12], audio_volume: 0.98 }
  cylinder_template:
    bore_mm: 120.0
    stroke_mm: 146.0
    connecting_rod_mm: 255.0
    piston_mass_g: 1320
    compression_ratio: 6.0
