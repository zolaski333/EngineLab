schema_version: 5
family: sport compact
# A Wankel twin-rotor of the RX-8's 13B-MSP "Renesis" class (high-power
# version): Mazda quotes 250 PS (184 kW) at 8,500 rpm and 211 N.m at 5,500
# rpm, 9,000 rpm redline. Rotor geometry is the 13B's (R 105, e 15, b 80:
# 654 cc a face). Port timing, port sizes, runners and the exhaust are
# estimated-family values, not Mazda's drawings: a side-exhaust Renesis has
# no overlap, its exhaust opening about 50 deg (eccentric shaft) before bottom
# dead centre and its intake closing about 65 deg after.
engine:
  name: 13B Renesis-like 2-Rotor
  cycle: rotary
  layout: inline
  cylinder_count: 6
  # Faces 1-3 on the front rotor, 4-6 on the rear, 180 deg of the eccentric
  # shaft between the rotors: a face fires every 180 deg.
  firing_order: [1, 4, 2, 5, 3, 6]
  idle_rpm: 800
  redline_rpm: 9000
  rotating_inertia_kg_m2: 0.11
  friction_coefficient: 0.11
  octane_rating: 98
  plenum_volume_l: 3.0
  throttle_diameter_mm: 65
  acoustic_observer: { left_microphone_m: { x: -0.18, y: 4.0, z: 0.8 }, right_microphone_m: { x: 0.18, y: 4.0, z: 0.8 }, sound_speed_mps: 0 }
  rotary:
    generating_radius_mm: 105
    eccentricity_mm: 15
    rotor_width_mm: 80
    rotor_count: 2
  intake:
    plenum_volume_l: 3.0
    throttle_diameter_mm: 65
    throttle_discharge_coefficient: 0.84
    # One runner per rotor; the three faces open onto its port in turn.
    runner_length_mm: 380
    runner_diameter_mm: 50
    idle_bypass_area_mm2: 26
    throttle_gamma: 1.35
    airbox_volume_l: 5.0
    inlet_duct_length_mm: 300
    inlet_duct_diameter_mm: 75
    bellmouth_diameter_mm: 85
  ignition:
    # Eccentric-shaft degrees: a stroke is 270 of them.
    rev_limit_rpm: 9000
    limiter_duration_s: 0.050
    timing_curve:
      - { rpm: 0, advance_deg: 5 }
      - { rpm: 1200, advance_deg: 10 }
      - { rpm: 3000, advance_deg: 20 }
      - { rpm: 5500, advance_deg: 28 }
      - { rpm: 7500, advance_deg: 30 }
      - { rpm: 9000, advance_deg: 28 }
  injection:
    mode: port
    # The face's cycle is 1,080 deg; its intake port opens near 543.
    start_angle_deg: 400
    end_angle_deg: 860
    injector_flow_mg_s: 16000
    fuel_temperature_c: 25
    rail_pressure_bar: 4.0
    reference_pressure_bar: 4.0
    wall_film_fraction: 0.20
    vaporisation_time_constant_s: 0.035
    latent_heat_kj_per_kg: 350
    port_charge_cooling_efficiency: 0.28
  camshafts:
    # The ports, as valves of the face's cycle (eccentric-shaft degrees after
    # or before the gas-exchange top dead centre). A trapezoid: the rotor's
    # flank sweeps a port open over a quarter of its duration.
    intake_duration_deg: 332
    intake_centerline_deg: 169
    intake_lift_mm: 8.0
    exhaust_duration_deg: 317
    exhaust_centerline_deg: 161.5
    exhaust_lift_mm: 7.5
    intake_lift_profile:
      - { angle_deg: -166, lift_mm: 0.0 }
      - { angle_deg: -83, lift_mm: 8.0 }
      - { angle_deg: 83, lift_mm: 8.0 }
      - { angle_deg: 166, lift_mm: 0.0 }
    exhaust_lift_profile:
      - { angle_deg: -158.5, lift_mm: 0.0 }
      - { angle_deg: -79, lift_mm: 7.5 }
      - { angle_deg: 79, lift_mm: 7.5 }
      - { angle_deg: 158.5, lift_mm: 0.0 }
    intake_flow_curve:
      - { lift_mm: 0.0, discharge_coefficient: 0.0 }
      - { lift_mm: 2.0, discharge_coefficient: 0.50 }
      - { lift_mm: 4.0, discharge_coefficient: 0.68 }
      - { lift_mm: 8.0, discharge_coefficient: 0.75 }
    exhaust_flow_curve:
      - { lift_mm: 0.0, discharge_coefficient: 0.0 }
      - { lift_mm: 2.0, discharge_coefficient: 0.48 }
      - { lift_mm: 4.0, discharge_coefficient: 0.66 }
      - { lift_mm: 7.5, discharge_coefficient: 0.72 }
  exhaust:
    primary_length_mm: 450
    primary_diameter_mm: 50
    collector_diameter_mm: 60
    muffler_restriction: 0.25
    outlet_diameter_mm: 65
    midpipe_length_mm: 2400
    muffler_chamber_diameter_mm: 120
    muffler_chamber_length_mm: 350
    muffler_packing_flow_resistivity_pa_s_m2: 18000
    muffler_packing_thickness_mm: 25
    muffler_perforated_open_area_ratio: 0.32
  combustion_calibration:
    # A leading and a trailing plug.
    ignition_site_count: 2
  uses:
    fuel: premium_gasoline_98
    transmission: jdm_6_speed
    vehicle: compact_coupe
  cylinder_template:
    # Bore and stroke are the rotor's equivalents (set from `rotary`); a rotor
    # reciprocates nothing, so the piston mass is never read.
    bore_mm: 121.24
    stroke_mm: 56.70
    connecting_rod_mm: 100.0
    piston_mass_g: 50
    compression_ratio: 10.0
    intake_valve_count: 3
    exhaust_valve_count: 2
    intake_valve_diameter_mm: 32.0
    exhaust_valve_diameter_mm: 30.0
