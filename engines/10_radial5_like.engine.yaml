  redline_rpm: 2400
  rotating_inertia_kg_m2: 0.86
  friction_coefficient: 0.19
  octane_rating: 92
  cooling_efficiency: 2.6
  plenum_volume_l: 6.4
  throttle_diameter_mm: 82
  acoustic_observer: { left_microphone_m: { x: -0.3, y: 6.0, z: 1.2 }, right_microphone_m: { x: 0.3, y: 6.0, z: 1.2 }, sound_speed_mps: 0 }
