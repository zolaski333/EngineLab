# The LS3's own: GM's cam card (14.0 / 13.3 mm lift, 254 / 260 deg at
# 0.006 in, both centrelines 117 deg) and a rectangle-port head flowed at
# 28 in H2O (Lingenfelter, EngineLabs, Edelbrock benches; possibly the L92
# head, the same castings), cfm x 4.378 = mm2 over the valve curtain. The
# exhaust saturates at 0.65 of head area, not the 0.51 a production port
# is given without a bench (journal 2026-11-02, -03).
gm_ls3:
  intake_duration_deg: 254
  exhaust_duration_deg: 260
  intake_lift_mm: 14.0
  exhaust_lift_mm: 13.3
  intake_centerline_deg: 117
  exhaust_centerline_deg: 117
  exhaust_port_head_area_fraction: 0.65
  intake_flow_curve:
    - { lift_mm: 0.0, discharge_coefficient: 0.0 }
    - { lift_mm: 2.54, discharge_coefficient: 0.70 }
    - { lift_mm: 5.08, discharge_coefficient: 0.78 }
    - { lift_mm: 7.62, discharge_coefficient: 0.68 }
    - { lift_mm: 10.16, discharge_coefficient: 0.69 }
    - { lift_mm: 12.7, discharge_coefficient: 0.565 }
    - { lift_mm: 15.24, discharge_coefficient: 0.53 }
  exhaust_flow_curve:
    - { lift_mm: 0.0, discharge_coefficient: 0.0 }
    - { lift_mm: 2.54, discharge_coefficient: 0.72 }
    - { lift_mm: 5.08, discharge_coefficient: 0.81 }
    - { lift_mm: 7.62, discharge_coefficient: 0.67 }
    - { lift_mm: 10.16, discharge_coefficient: 0.62 }
    - { lift_mm: 12.7, discharge_coefficient: 0.52 }
    - { lift_mm: 15.24, discharge_coefficient: 0.43 }

