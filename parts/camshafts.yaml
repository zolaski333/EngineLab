# The 2JZ-GTE's own: Toyota's 233 / 233 deg and 8.25 / 8.25 mm (the
# USDM / European cams; the centrelines are the street turbo's, not found).
# Curtain Cd: the median of five benches of the stock head at 28 in H2O
# (Supramania "Supra head flow" thread: BXRsupra, poggie, M2racing,
# silvino, StuHagen), cfm x 4.378 = mm2 over two 33.5 / 29.0 mm valves.
# Its plateaus are the literature's: 0.56 / 0.50 of head area at 0.5 in.
toyota_2jz_gte:
  intake_duration_deg: 233
  exhaust_duration_deg: 233
  intake_lift_mm: 8.25
  exhaust_lift_mm: 8.25
  intake_centerline_deg: 112
  exhaust_centerline_deg: 116
  intake_flow_curve:
    - { lift_mm: 0.0, discharge_coefficient: 0.0 }
    - { lift_mm: 1.27, discharge_coefficient: 0.737 }
    - { lift_mm: 2.54, discharge_coefficient: 0.753 }
    - { lift_mm: 3.81, discharge_coefficient: 0.753 }
    - { lift_mm: 5.08, discharge_coefficient: 0.688 }
    - { lift_mm: 6.35, discharge_coefficient: 0.622 }
    - { lift_mm: 7.62, discharge_coefficient: 0.560 }
    - { lift_mm: 10.16, discharge_coefficient: 0.461 }
  exhaust_flow_curve:
    - { lift_mm: 0.0, discharge_coefficient: 0.0 }
    - { lift_mm: 1.27, discharge_coefficient: 0.700 }
    - { lift_mm: 2.54, discharge_coefficient: 0.709 }
