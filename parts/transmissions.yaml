  gearbox_input_inertia_kg_m2: 0.07
  differential_inertia_kg_m2: 0.15
  clutch_thermal_capacity_j_per_c: 22000
  clutch_cooling_w_per_c: 9.0

jdm_6_speed:
  gear_ratios: [3.83, 2.36, 1.69, 1.31, 1.00, 0.79]
  final_drive_ratio: 4.10
  max_clutch_torque_nm: 760
  reverse_ratio: 3.55
  gearbox_input_inertia_kg_m2: 0.075
  differential_inertia_kg_m2: 0.17
  clutch_thermal_capacity_j_per_c: 24000
  clutch_cooling_w_per_c: 9.5

muscle_6_speed:
  gear_ratios: [2.66, 1.78, 1.30, 1.00, 0.80, 0.63]
  final_drive_ratio: 3.42
  max_clutch_torque_nm: 1350
  reverse_ratio: 2.90
  gearbox_input_inertia_kg_m2: 0.12
  differential_inertia_kg_m2: 0.24
  clutch_thermal_capacity_j_per_c: 32000
  clutch_cooling_w_per_c: 12.0

# A motorcycle has THREE reductions, not two: a primary drive from crank to
# clutch basket (typically 1.6-2.0), the gearbox, then the chain. There is no
# primary field in TransmissionConfig, so it is folded into final_drive_ratio --
# which is simply everything outside the gearbox.
#
# It used to be missing altogether, and the symptom was exactly what you would
# predict: wheel torque halved in every gear, so every bike accelerated as if
# braked, and 1st gear reached 141 km/h at 9,000 rpm. Cross-check against the
# MT-07 it is modelled on (primary 68/41 = 1.925, chain 43/16 = 2.688, 0.300 m
# tyre): total 1st 14.73 and 6th 5.38 give 69 km/h and 189 km/h at 9,000 rpm,
# against 141 and 314 before. Keep gear_ratios as real GEARBOX ratios and any
# primary reduction inside final_drive_ratio, or the arithmetic drifts back.
# Rotating inertias: the wheel, differential and input defaults are a car's
# (four wheels, 3.6 kg m^2; a prop shaft and differential; a car's gearbox
# input). A motorcycle has two wheels of about 0.5-0.7 kg m^2 each with tyre,
# discs and sprocket (MathWorks' motorcycle chain block defaults the rear to
# 0.66), a chain and two sprockets, and a clutch basket and input shaft of about
# 0.01-0.015 kg m^2 turning at crank speed / primary: the model reflects the
# input inertia through gear x final drive, which includes the primary, so it
# is entered divided by primary^2. Left at the car's, first gear alone carried
# some 21 kg m^2 at the wheel, the equivalent of 230 kg more motorcycle.
motorcycle_6_speed:
  gear_ratios: [2.846, 1.947, 1.500, 1.269, 1.111, 1.040]
  final_drive_ratio: 5.174   # primary 1.925 x chain 2.688
  max_clutch_torque_nm: 320
  driven_wheel_inertia_kg_m2: 1.2
  differential_inertia_kg_m2: 0.02
  gearbox_input_inertia_kg_m2: 0.004   # ~0.013 / 1.925^2

# The same box with an upshift quickshifter: a motorcycle gearbox is a
# sequential dog box, and the shifter cuts the ignition while the dogs change
# (65 ms, within the 50-80 ms of aftermarket units). Downshifts keep the
# clutch: no auto-blipper.
motorcycle_6_speed_quickshifter:
  gear_ratios: [2.846, 1.947, 1.500, 1.269, 1.111, 1.040]
  final_drive_ratio: 5.174   # primary 1.925 x chain 2.688
  max_clutch_torque_nm: 320
  driven_wheel_inertia_kg_m2: 1.2
  differential_inertia_kg_m2: 0.02
  gearbox_input_inertia_kg_m2: 0.004   # ~0.013 / 1.925^2
  shift_style: sequential
  quickshifter: true
  quickshifter_cut_s: 0.065
  auto_blipper: false

# Same correction: a big-twin cruiser runs a primary around 1.6 and a belt final
# near 2.2, so the reduction outside the gearbox is ~3.5, not 2.10.
cruiser_6_speed:
  gear_ratios: [3.34, 2.31, 1.72, 1.39, 1.19, 1.00]
  final_drive_ratio: 3.52    # primary 1.60 x belt 2.20
  max_clutch_torque_nm: 420
  driven_wheel_inertia_kg_m2: 1.6     # heavier cruiser wheels
  differential_inertia_kg_m2: 0.03
  gearbox_input_inertia_kg_m2: 0.008   # ~0.02 / 1.60^2

aircraft_direct:
  gear_ratios: [1.00]
  final_drive_ratio: 1.00
  max_clutch_torque_nm: 10000

# A car's belt CVT (no torque converter: a wet start clutch that creeps, as a
# dual clutch's). The variator runs between the first and the last ratio; the
# 2.5-0.4 range (span 6.25) and 5.0 final are typical of current belt CVTs,
# not a specific unit's published figures.
car_cvt:
  gear_ratios: [2.50, 0.40]
  final_drive_ratio: 5.00
  max_clutch_torque_nm: 450
  shift_style: cvt
  reverse_ratio: 2.50

# A scooter's variator with a centrifugal clutch, which idles free and bites
# at 1.7 x idle by default. Range 2.6-0.85 (span about 3) and a 9.4 final:
# a 125 cc scooter reaching ~105 km/h at 8,500 rpm on a 0.26 m rear tyre
# needs about 8.0 overall at the top, which this gives; the span is typical,
# not a specific model's.
scooter_cvt:
  gear_ratios: [2.60, 0.85]
  final_drive_ratio: 9.40
  max_clutch_torque_nm: 60
  shift_style: cvt
  centrifugal_clutch: true
  driven_wheel_inertia_kg_m2: 0.35
  differential_inertia_kg_m2: 0.005
  gearbox_input_inertia_kg_m2: 0.001
