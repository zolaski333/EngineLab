# Fuels a user can pick (the Combustion part's inspector lists them in this
# order). `octane_rating` is the research octane number the knock model reads;
# `latent_heat_kj_per_kg` is the liquid's heat of vaporisation, the port or
# cylinder charge cooling. An engine file naming one under `uses: fuel:`
# takes its properties only: its octane stays its own `octane_rating`.
#
# Alcohol blends are mass-weighted from their components (Heywood, Internal
# Combustion Engine Fundamentals, 2nd ed., Table D.4): ethanol LHV 26.9 MJ/kg,
# stoichiometric AFR 9.0, latent heat 840 kJ/kg; methanol 20.0 MJ/kg, 6.47,
# 1,103 kJ/kg; gasoline 43.0 MJ/kg, 14.7, 350 kJ/kg. Laminar flame speeds
# keep the alcohol-to-isooctane ratios of Metghalchi and Keck (1982):
# methanol x1.40; ethanol x1.2 (Gulder 1982).

pump_gasoline_95:
  name: Pump gasoline 95 RON
  lower_heating_value_mj_per_kg: 43.0
  density_kg_per_l: 0.745
  stoichiometric_afr: 14.7
  molar_mass_g_per_mol: 114.23
  oxygen_moles_per_fuel_mole: 12.5
  product_moles_per_fuel_mole: 17.0
  laminar_flame_speed_mps: 0.38
  turbulence_flame_speed_gain: 1.55
  octane_rating: 95
  latent_heat_kj_per_kg: 350

premium_gasoline_98:
  name: Premium gasoline 98 RON
  lower_heating_value_mj_per_kg: 43.2
  density_kg_per_l: 0.750
  stoichiometric_afr: 14.7
  molar_mass_g_per_mol: 114.23
  oxygen_moles_per_fuel_mole: 12.5
  product_moles_per_fuel_mole: 17.0
  laminar_flame_speed_mps: 0.39
  turbulence_flame_speed_gain: 1.60
  octane_rating: 98
  latent_heat_kj_per_kg: 350

# 10 % ethanol by volume (10.3 % by mass), sold as 95 RON (EN 228).
gasoline_e10:
  name: Gasoline E10 95 RON
  lower_heating_value_mj_per_kg: 41.3
  density_kg_per_l: 0.750
  stoichiometric_afr: 14.11
  molar_mass_g_per_mol: 99.1
  oxygen_moles_per_fuel_mole: 10.40
  product_moles_per_fuel_mole: 14.34
  laminar_flame_speed_mps: 0.39
  turbulence_flame_speed_gain: 1.55
  octane_rating: 95
  latent_heat_kj_per_kg: 400

# 85 % ethanol by volume (85.7 % by mass); RON 100-105 is quoted, 105 taken.
ethanol_e85:
