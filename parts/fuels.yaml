  lower_heating_value_mj_per_kg: 26.9
  density_kg_per_l: 0.789
  stoichiometric_afr: 9.0
  molar_mass_g_per_mol: 46.07
  oxygen_moles_per_fuel_mole: 3.0
  product_moles_per_fuel_mole: 5.0
  laminar_flame_speed_mps: 0.46
  turbulence_flame_speed_gain: 1.55
  octane_rating: 109
