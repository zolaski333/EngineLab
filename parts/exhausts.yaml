# Scalar muffler_chamber_* describes the outer expansion chamber. During
# legacy-to-graph conversion, a packed silencer is made explicit instead:
# the graph muffler diameter is the perforated mean-flow core, its length is
# the real can length, and volume_l is the gross outer-can volume. The sealed
# difference between gross volume and swept core volume is acoustic storage,
# never an enlarged gas-flow bore. A dry muffler keeps the expansion-chamber
# interpretation. Omitting diameter or length means "no silencer" -- the
# correct model for an open stack, and what aircraft/radial/open presets keep.
# muffler_restriction remains a mean-flow pressure-loss coefficient. It does
# not drive acoustic absorption: overloading it previously collapsed the
# low-frequency feedback loop. The chamber below is deliberately reactive.
# Custom graph mufflers and scalar expansion chambers can opt into
# Delany-Bazley porous absorption with
# packing_flow_resistivity_pa_s_m2, packing_thickness_mm and
# perforated_open_area_ratio. None is inferred: without authored material data
# the acoustic path remains an exact dry bypass.
#
# The runtime composes the core delay, Delany-Bazley porous loss and a bounded
# lowest-order passive compliance for the coupled annular volume. It does not
# invent perforation inertance without hole diameter and sheet thickness.
# Values below are estimated-family data, not manufacturer measurements;
# absence still means an exact dry chamber. These are hardware inputs, never a
# target dB gain.

compact_sport:
  primary_length_mm: 520
  primary_diameter_mm: 42
  collector_diameter_mm: 58
  muffler_restriction: 0.34
  outlet_diameter_mm: 63
  # Cat-back sports rear box: small body, short, so its pass-bands sit high and
  # it keeps the rasp a Subaru flat-four is known for.
  muffler_chamber_diameter_mm: 112
  muffler_chamber_length_mm: 330
  muffler_packing_flow_resistivity_pa_s_m2: 22000
  muffler_packing_thickness_mm: 30
  muffler_perforated_open_area_ratio: 0.28

turbo_downpipe:
  primary_length_mm: 430
  primary_diameter_mm: 40
  collector_diameter_mm: 64
  muffler_restriction: 0.46
  outlet_diameter_mm: 76
  # The quietest exhaust in the catalogue and it should be: a large, long,
  # heavily packed OEM box behind a turbine that has already absorbed the
  # blowdown edge. Long body means closely spaced, low pass-bands.
  muffler_chamber_diameter_mm: 132
  muffler_chamber_length_mm: 470
  muffler_packing_flow_resistivity_pa_s_m2: 30000
  muffler_packing_thickness_mm: 45
  muffler_perforated_open_area_ratio: 0.25

equal_length_header:
  primary_length_mm: 760
  primary_diameter_mm: 45
  collector_diameter_mm: 63
  muffler_restriction: 0.25
  outlet_diameter_mm: 70
  # High-revving naturally aspirated four: a modest, lightly packed box, so the
  # VTEC top end keeps its edge instead of being boxed in.
  muffler_chamber_diameter_mm: 114
  muffler_chamber_length_mm: 300
  muffler_packing_flow_resistivity_pa_s_m2: 18000
  muffler_packing_thickness_mm: 25
  muffler_perforated_open_area_ratio: 0.32

crossplane_dual:
  primary_length_mm: 690
  primary_diameter_mm: 48
  collector_diameter_mm: 76
  muffler_restriction: 0.30
  outlet_diameter_mm: 82
  # American chambered V8 muffler: wide body, short, lightly packed. The wide
  # spacing of its pass-bands is exactly what lets the uneven-bank burble
  # through instead of averaging it away.
  muffler_chamber_diameter_mm: 142
  muffler_chamber_length_mm: 400
  muffler_packing_flow_resistivity_pa_s_m2: 10000
  muffler_packing_thickness_mm: 15
  muffler_perforated_open_area_ratio: 0.35

motorcycle_4_2_1:
  primary_length_mm: 610
  primary_diameter_mm: 34
  collector_diameter_mm: 48
  muffler_restriction: 0.20
  outlet_diameter_mm: 52
  # A can, not a box: small expansion and barely packed, so the first pass-band
  # is high and the litre-bike top end stays bright.
  muffler_chamber_diameter_mm: 84
  muffler_chamber_length_mm: 250
  muffler_packing_flow_resistivity_pa_s_m2: 18000
  muffler_packing_thickness_mm: 22
  muffler_perforated_open_area_ratio: 0.35

# Aftermarket full system for the 689 cc CP2 parallel twin, 2-into-1.
#
# WHY THIS EXISTS AS A SEPARATE PRESET. The CP2 ships on `motorcycle_4_2_1`,
# which it SHARES with the Hayabusa and the CP4 -- 610 mm x 34 mm primaries into
# a 48 mm collector. Those are litre-class four-cylinder dimensions: a 689 cc
# twin moves roughly twice the mass per exhaust event through each pipe, and real
# MT-07 headers are 40-45 mm. The stock preset is not wrong for the bikes it was
# written for, it is simply not a twin's.
#
# This entry is `estimatedFamily`: dimensions typical of a quality full titanium
# 2-1 system for this platform, NOT measured from a specific product. Do not
# present them as a manufacturer figure.
#
# Equal-length primaries because that is what a good system does -- the 270-degree
# crank already supplies the uneven 270/450 firing gap that gives this engine its
# character, and unequal primaries would smear the very edge that carries it.
# Collector area is about 1.7x one primary, the usual 2-1 merge ratio.
#
# The former preset falsified the body down to 72 mm because the renderer had no
# absorptive liner and a real 105-110 mm can acted like an over-deep dry
# expansion chamber. Porous loss is now a first-class physical element, so the
# real family-scale body and perforated packing can be represented directly.
cp2_full_system:
  primary_length_mm: 500
  primary_diameter_mm: 42
  collector_diameter_mm: 54
  # Race system: far less mean-flow loss than the 0.20 street can.
  muffler_restriction: 0.10
  outlet_diameter_mm: 60
  muffler_chamber_diameter_mm: 105
  muffler_chamber_length_mm: 240
  muffler_packing_flow_resistivity_pa_s_m2: 16000
  muffler_packing_thickness_mm: 30
  muffler_perforated_open_area_ratio: 0.32

# Listening-lab sibling of cp2_full_system. Geometry and mean-flow restriction
# are identical, so an A/B isolates the absorptive packing instead of quietly
# changing pipe dimensions. The material values are representative estimates
# for a straight-through perforated-core motorcycle can, not manufacturer data.
cp2_absorptive_lab:
  primary_length_mm: 500
  primary_diameter_mm: 42
  collector_diameter_mm: 54
  muffler_restriction: 0.10
  outlet_diameter_mm: 60
  muffler_chamber_diameter_mm: 105
  muffler_chamber_length_mm: 240
  muffler_packing_flow_resistivity_pa_s_m2: 24000
  muffler_packing_thickness_mm: 35
  muffler_perforated_open_area_ratio: 0.28

short_v_twin:
  primary_length_mm: 880
  primary_diameter_mm: 46
  collector_diameter_mm: 60
  muffler_restriction: 0.18
  outlet_diameter_mm: 60
  # Slip-on straight-through: the smallest expansion in the catalogue, because
  # a big twin's character is the uneven firing gap and a real silencer would
  # be the first thing its owner removed.
  muffler_chamber_diameter_mm: 82
  muffler_chamber_length_mm: 430
  muffler_packing_flow_resistivity_pa_s_m2: 14000
  muffler_packing_thickness_mm: 20
  muffler_perforated_open_area_ratio: 0.38

# Short individual ejector stacks, near-open to atmosphere. A Merlin-style
# aircraft V12 exhausts each cylinder through its own ~150 mm stack with no
# collector or silencer; the previous 980 mm primaries into a 128 mm manifold
# buried the blowdown crack in a low-frequency boom (and cost ~3x the FV cells,
# pushing the V12 past the realtime budget). The wide "collector" here stands
# in for the shared atmosphere-side merge the model topology requires.
aircraft_manifold:
  primary_length_mm: 150
  primary_diameter_mm: 52
  collector_diameter_mm: 130
  muffler_restriction: 0.02
  outlet_diameter_mm: 140

# No muffler_chamber_* below: these three exhaust to atmosphere through a
# near-open pipe in reality, which is why they already sounded right when the
# straight-pipe model was all there was. Giving them a chamber would be adding
# hardware they do not have.
flat6_equal_length:
  primary_length_mm: 720
  primary_diameter_mm: 42
  collector_diameter_mm: 66
  muffler_restriction: 0.22
  outlet_diameter_mm: 74

radial_collector:
  primary_length_mm: 920
  primary_diameter_mm: 54
  collector_diameter_mm: 96
  muffler_restriction: 0.08
  outlet_diameter_mm: 110
