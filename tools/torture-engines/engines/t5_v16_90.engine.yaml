schema_version: 5
family: torture
# Torture engine: 8.0 L V16, 90 deg, even 45 deg firing.
engine:
  name: Torture V16 8.0 90deg
  layout: v
  bank_angle_deg: 90
  cylinder_count: 16
  firing_order: [1, 9, 2, 10, 3, 11, 4, 12, 8, 16, 7, 15, 6, 14, 5, 13]
  idle_rpm: 700
  redline_rpm: 6500
  rotating_inertia_kg_m2: 0.45
  friction_coefficient: 0.13
  octane_rating: 98
  plenum_volume_l: 8.0
  throttle_diameter_mm: 100
  intake:
    plenum_volume_l: 8.0
    throttle_diameter_mm: 100
    runner_length_mm: 350
    runner_diameter_mm: 42
    idle_bypass_area_mm2: 45
  ignition:
    rev_limit_rpm: 6700
    timing_curve:
      - { rpm: 0, advance_deg: 10 }
      - { rpm: 2500, advance_deg: 24 }
      - { rpm: 5000, advance_deg: 30 }
      - { rpm: 6700, advance_deg: 30 }
  uses:
    injection: sequential_port
    camshafts: street_mild
    exhaust: crossplane_dual
    transmission: sport_6_speed
    vehicle: muscle_car
  cylinder_template:
    bore_mm: 86.0
    stroke_mm: 86.0
    connecting_rod_mm: 145.0
    piston_mass_g: 360
    compression_ratio: 10.5
